name: CI

# Trois branches (modèle du 16 sept. 2026, docs/operations.md §5) :
#  - `staging` (ex-`spike/cloudcannon`) = branche d'ÉDITION : chaque
#    sauvegarde CloudCannon y commite directement, sans vérification avant le
#    build de l'hébergeur → le CI y tourne (second signal quand une sauvegarde
#    casse le build — incidents `null` et clés supprimées des 14-16 sept.) ;
#  - `dev` = intégration des développeurs (branches feat/* → PR → dev), promue
#    vers `staging` par PR ;
#  - `main` = production, avancée uniquement par le bouton Publish CloudCannon.
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      # Pastilles/vignettes de l'éditeur (public/images/cms) à jour et listes
      # _select_data alignées sur les dessins des composants (2026-09-17).
      - name: CMS previews (fonds + icônes)
        run: npm run cms:previews:check

      # Rejoue l'étape Bookshop du build CloudCannon (retrait des scripts par
      # regex + compilation) sur chaque composant — seule étape que le build
      # Astro local ne couvre pas (incident du 2026-09-17, operations.md §8).
      - name: Bookshop (moteur de l'éditeur visuel)
        run: npm run check:bookshop

      # Éditeur CloudCannon (2026-09-18) : un champ n'apparaît que si sa CLÉ existe
      # dans le fichier — 86 sections sans `fond` = 86 listes déroulantes
      # invisibles ; et les vignettes du sélecteur doivent s'appeler
      # <composant>.preview.png. Réparation : npm run fix:sections.
      - name: Sections (clés attendues par l'éditeur + vignettes)
        run: npm run check:sections

      # Redirections de la migration (2026-09-22) : la matrice
      # src/data/redirects-migration.json est GÉNÉRÉE — elle doit rester à jour
      # avec le contenu (un slug changé sans redirection = un 404 sur une URL
      # que Google a indexée). Réparation : npm run build:redirects.
      - name: Redirections (matrice à jour, aucune URL sans cible)
        run: npm run check:redirects

      - name: Build
        run: npm run build

      # Cibles des redirections (2026-09-22) : une 301 vers un 404 est PIRE
      # qu'un 404 — la page d'origine perd son référencement sans rien
      # transmettre. Se joue après le build, sur dist/.
      - name: Redirections (les cibles existent bien)
        run: node scripts/build-redirects.mjs --dist

      # Liens internes (2026-09-18) : tout <a href> interne du site construit
      # doit mener à une page de dist/ — deux incidents de liens cassés saisis
      # dans l'éditeur en trois jours (anciennes URL WordPress, préfixe de
      # langue oublié). Bloquant ici ; simple avertissement sur CloudCannon
      # (.cloudcannon/postbuild). Réparation mécanique : npm run fix:links.
      - name: Liens internes
        run: npm run check:links -- --strict

      # Non-blocking for now: the current highs are transitive via wrangler
      # (build-time tooling), and the fix requires the @astrojs/cloudflare v14 /
      # Astro 7 jump. Tracked in the roadmap. Keep visible without failing CI.
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high || true

  # E2E runs separately because it installs browsers.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

# ─────────────────────────────────────────────────────────────────────────────
# Deploy is intentionally NOT here yet. Today the site deploys via Cloudflare
# Pages' Git integration. To switch to CI-driven deploys (per-PR previews +
# decoupled from the dashboard), add a deploy job using cloudflare/wrangler-action
# with CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets. See docs/DEPLOYMENT.md.
