<!--
  Logo Victrix — FR (« Une marque Alan Allman Associates »).

  SOURCE : 02_Logos/FR/SVG/Logo Victrix_Bleu nuit.svg
  fourni par le marketing le 2026-09-22.

  SEULES MODIFICATIONS, aucun tracé n'a été touché :
   - viewBox recalé sur le CONTENU (le fichier d'origine embarque ~12 % de
     marge d'artboard en haut ; sans ce recadrage le logo rendrait 23 % plus
     petit que l'ancien à --logo-height égal, et toute la barre bougerait) ;
   - le bloc <defs><style> et sa couleur en dur sont retirés — la couleur
     vient du CSS de Logo.astro, c'est ce qui permet la variante blanche ;
   - class="cls-1" devient .lv-mark (mot-symbole) et .lv-sign (signature).
     Les DEUX prennent la même couleur : le logo officiel est MONOCHROME.
     Deux classes plutôt qu'une pour garder l'option ouverte sans dévier.

  Pour régénérer après une nouvelle livraison de marque : recaler le viewBox
  sur le contenu (rendu + découpe automatique) et rejouer ces trois règles.
-->
