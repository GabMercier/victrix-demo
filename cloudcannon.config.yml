    url: /en/services/{slug}/
    preview:
      icon: rocket_launch
      text:
        - key: title
        - text: Service sans titre
      subtext:
        - key: description
    # « + Ajouter » : gabarit de la langue (patron de la collection forms).
    # Flux de traduction : créer (ou Dupliquer) le même nom de fichier dans
    # l'autre collection Services.
    schemas:
      default:
        name: Service (EN)
        icon: rocket_launch
        path: schemas/service-en.json
        remove_extra_inputs: false
        create:
          path: '{title|slugify}.json'
    _inputs: *services_inputs

  # Pages génériques (2026-08-11) — pages composables de PREMIER NIVEAU d'URL
  # (/decouvrir, /expertises, /produits, /secteurs, /tarification,
  # /centre-de-confiance, pages légales…), rendues par la route attrape-tout
  # src/pages/[lang]/[...slug].astro. PATRON EXACT de la collection services
  # (mêmes sections, mêmes gabarits par langue), sans le préfixe /services/.
  # Créées comme PLACEHOLDERS (noindex activé) : remplacer le contenu puis
  # désactiver « Masquer des moteurs de recherche » quand la page est prête.
  pages:
    path: src/content/pages
    # « Pages générales » plutôt que « Pages » (recette éditeur 2026-09-09 :
    # l'appellation nue laissait croire que TOUTES les pages du site vivaient
    # ici, alors que services/solutions/articles ont leurs collections).
    name: Pages générales
    singular_name: Page
    description: >-
      Pages générales du site (Découvrir, Expertises, Produits, Secteurs,
      Tarification, Centre de confiance, pages légales…), bâties par sections.
      Les dossiers fr/ et en/ contiennent les deux langues ; le même nom de
      fichier relie une traduction à l'autre. Une page placeholder reste
      masquée des moteurs tant que « Masquer des moteurs de recherche » est
      activé.
    icon: description
    _enabled_editors:
      - visual
      - data
    # fr/<slug>.json → /fr/<slug>/ (pas de préfixe — pages de premier niveau).
    url: /[relative_base_path]/[slug]/
    preview:
      icon: description
      text:
        - key: title
        - text: Page sans titre
      subtext:
        - key: description
    schemas:
      default:
        name: Page (FR)
        icon: description
        path: schemas/page-fr.json
        remove_extra_inputs: false
        create:
          path: 'fr/{title|slugify}.json'
      en:
        name: Page (EN)
        icon: description
        path: schemas/page-en.json
        remove_extra_inputs: false
        create:
          path: 'en/{title|slugify}.json'
    _inputs:
      title:
        type: text
        options:
          empty_type: string
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO). Selon le contexte, sert aussi de
          libellé à certaines sections.
      slug:
        type: text
        options:
          empty_type: string
        label: Adresse de la page (segment d'URL)
        comment: >-
          Segment après /<langue>/ — surtout pour la version EN (ex.
          discover). Vide = le nom du fichier (cas normal en FR). Le NOM DE
          FICHIER reste ce qui apparie FR et EN — changer l'adresse ne rompt
          pas la traduction ; changer une adresse déjà publiée exige une
          redirection (collection Redirections).
      description:
        type: textarea
        options:
          empty_type: string
        label: Description
        comment: >-
          Description pour les moteurs de recherche et les partages.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          ACTIVÉ par défaut sur une nouvelle page (placeholder). Le désactiver
          quand la page a son vrai contenu — elle entre alors aussi au sitemap
          automatiquement.
      seoTitle:
        type: text
        options:
          empty_type: string
        label: Titre SEO (surcharge)
        comment: >-
          Remplace le titre dans l'onglet du navigateur et les résultats
          Google. Vide = le titre de la page.
      seoH1:
        type: text
        options:
          empty_type: string
        label: H1 SEO (optionnel)
        comment: >-
          Le titre H1 lu par les moteurs de recherche. Vide = le grand titre du
          héros est le H1 (défaut). Renseigné = ce texte devient le H1 de la
          page (invisible à l'écran, lu par Google et les lecteurs d'écran) et
          le grand titre passe en H2 : rien ne change visuellement. Un seul H1
          par page.
      # Préremplissage du formulaire Contact (2026-09-17) : tout bouton de
      # la page qui mène à Contact arrive sur un formulaire où ces deux listes
      # sont déjà choisies (plus le libellé du bouton et la page d'origine dans
      # « Précisez votre demande »). Les liens du menu et du pied de page ne
      # sont pas concernés.
      contactSujet:
        type: select
        label: Contact — sujet présélectionné
        comment: >-
          Choix prérempli dans « De quoi souhaitez-vous parler ? » quand un
          visiteur clique un bouton de cette page vers Contact. Vide = aucun choix prérempli.
        options:
          empty_type: string
          allow_empty: true
          values: _select_data.contact_sujets
          value_key: cle
          preview:
            text:
              - key: libelle
      contactService:
        type: select
        label: Contact — service présélectionné
        comment: >-
          Choix prérempli dans « Service » (même mécanique). Vide =
          aucun choix prérempli.
        options:
          empty_type: string
          allow_empty: true
          values: _select_data.contact_services
          value_key: cle
          preview:
            text:
              - key: libelle
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder le
          héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      type:
        hidden: true

  # Catalogue de solutions (/fr|en/solutions) — fiches JSON à plat, une carte
  # du catalogue par fiche (suite n°1 du plan
  # docs/design/solutions-catalogue-plan.md §3). Éditeur de données : la fiche
  # n'a PAS de page propre (le catalogue est une page unique avec filtres) —
  # les pages de détail /solutions/<slug> restent une suite planifiée.
  # Depuis le 2026-09-17, la PAGE catalogue est une page générale
  # (src/content/pages/{fr,en}/solutions.json, section « Catalogue de
  # solutions ») : son chrome (titre, recherche, filtres, vedette, message
  # vide, appel à l'action) s'édite dans « Pages générales » ; seules les
  # FICHES vivent ici.
  solutions:
    path: src/content/solutions
    name: Solutions
    singular_name: Solution
    description: >-
      Fiches du catalogue de solutions (page /solutions). Les dossiers fr/ et
      en/ contiennent les deux langues ; le même nom de fichier relie une
      traduction à l'autre. Chaque fiche est une carte du catalogue.
    icon: apps
    # Pas de page par fiche — l'URL d'aperçu pointe le CATALOGUE de la langue
    # (2026-08-17, demande user : préversion partout) : la carte éditée s'y
    # trouve. [relative_base_path] = fr|en (sous-dossier).
    url: /[relative_base_path]/solutions/
    # ÉDITEUR DE DONNÉES SEULEMENT (2026-09-18, retour user : « seulement l'en-tête
    # et le pied de page dans l'édition en direct »). Depuis que le catalogue est
    # une SECTION Bookshop (17/09), l'éditeur visuel re-rend la page à partir du
    # fichier OUVERT : une fiche de solution n'a pas de `sections`, donc le
    # contenu de la page disparaissait — l'aperçu ne pouvait qu'être vide. Le
    # formulaire de données édite la fiche ; le rendu se vérifie sur la page
    # « Solutions » (collection Pages). L'édition visuelle reviendra, par fiche,
    # quand chaque solution aura sa propre page (docs/plan-livraison-finale.md,
    # lots L10–L11).
    _enabled_editors:
      - data
    preview:
      icon: apps
      text:
        - key: title
        - text: Solution sans titre
      subtext:
        - key: description
    # « + Ajouter » : un gabarit par langue pour que le fichier atterrisse dans
    # fr/ ou en/ avec un JSON valide (même logique que services/forms). Flux de
    # traduction : créer (ou Dupliquer) le même nom de fichier dans l'autre
    # dossier.
    schemas:
      default:
        name: Solution (FR)
        icon: apps
        path: schemas/solution-fr.json
        remove_extra_inputs: false
        create:
          path: 'fr/{title|slugify}.json'
      en:
        name: Solution (EN)
        icon: apps
        path: schemas/solution-en.json
        remove_extra_inputs: false
        create:
          path: 'en/{title|slugify}.json'
    _inputs:
      title:
        type: text
        options:
          empty_type: string
        label: Titre
      description:
        # Texte enrichi (2026-09-16, hors sections) : gras · italique · lien, un paragraphe.
        type: html
        options:
          format: p
          bulletedlist: false
          numberedlist: false
          blockquote: false
          bold: true
          italic: true
          link: true
          undo: true
          redo: true
          underline: false
          strike: false
          image: false
          table: false
          code: false
          embed: false
          horizontalrule: false
          snippet: false
          remove_custom_markup: true
          empty_type: string
        label: Description
        comment: Texte affiché sur la carte du catalogue.
      image:
        type: image
        label: Image de la vignette
        comment: >-
          Optionnelle — vide, la carte affiche une vignette de remplacement
          grise. Les téléversements atterrissent dans public/images/solutions/
          (adresse servie telle quelle, /images/…).
        options:
          empty_type: string
          paths:
            static: public
            uploads: public/images/solutions
      sector:
        type: text
        options:
          empty_type: string
        label: Secteur d'activité
        comment: >-
          Chip en haut de la vignette ET valeur du filtre « Secteurs
          d'activité » : reprendre EXACTEMENT la graphie des autres fiches —
          une variante (accent, majuscule) crée un filtre séparé.
      solutionType:
        type: text
        options:
          empty_type: string
        label: Type de solution
        comment: >-
          Chip au pied de la carte ET valeur du filtre « Types de solution » —
          même consigne de graphie exacte que le secteur.
      featured:
        type: switch
        label: Solution vedette
        comment: >-
          Activé : la fiche alimente le grand panneau bleu nuit en tête de
