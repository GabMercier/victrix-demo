  # Services (P-07) — pages composables PUBLIQUES et indexables, même palette de
  # sections que les campagnes (src/content/services). Patron de la collection
  # landing, MAIS : éditeur data (JSON, pas de corps markdown), noindex par
  # défaut à FALSE (inverse des campagnes), et création par gabarit PAR LANGUE
  # (schemas/service-{fr,en}.json, comme la collection forms). Les CHAMPS des
  # sections viennent des specs .bookshop.yml (générés dans _structures.sections,
  # qui priment sur les _inputs de collection) — d'où des _inputs de collection
  # volontairement minimaux (page + sections).
  # Services — DEUX collections, une par langue (2026-09-18), pour que
  # l'URL d'aperçu CloudCannon soit exacte aussi pour les services IMBRIQUÉS
  # (fr/productivite/x.json → /fr/services/productivite/x/). Avec une seule
  # collection sur src/content/services, [relative_base_path] valait
  # « fr/productivite » et le gabarit /[relative_base_path]/services/[slug]/
  # donnait /fr/productivite/services/x/ → 404 → « No preview available »
  # et pas d'éditeur visuel sur les 36 services enfants (revue de Clément,
  # 2026-09-18). Désormais :
  #  - FR : l'URL suit le chemin du fichier ([full_slug] = sous-dossier/nom
  #    sans extension), exactement comme la route
  #    src/pages/[lang]/services/[...slug].astro sans champ `slug` ;
  #  - EN : l'URL suit le champ `slug` de la page ({slug} = donnée), que la
  #    route applique aussi — chaque fichier EN DOIT porter son slug (les six
  #    qui n'en avaient pas l'ont reçu le 2026-09-18, égal à leur nom).
  # Le même nom de fichier dans fr/ et en/ relie toujours une traduction à
  # l'autre. Les entrées (_inputs) sont écrites UNE fois (ancre YAML
  # &services_inputs) et reprises par la collection EN (*services_inputs).
  # À VÉRIFIER après le premier build CloudCannon : que les « / » du slug EN
  # ne sont pas encodés dans l'URL d'aperçu (sinon : champ `permalink` +
  # script, plan docs/plan-icones-cta-apercus.md §1).
  services_fr:
    path: src/content/services/fr
    name: Services (FR)
    singular_name: Service
    description: >-
      Pages de services en français, bâties par sections (comme les
      campagnes) mais PUBLIQUES et indexables. Un sous-dossier = les services
      enfants d'un service (ex. productivite/o-bureau). Le même nom de
      fichier dans « Services (EN) » relie la traduction.
    icon: rocket_launch
    # Éditeur visuel par défaut (première valeur — voir le commentaire de la
    # collection blog) ; Data en second pour le front matter / SEO. Pas de
    # corps markdown (fichiers JSON) → pas de `content`.
    _enabled_editors:
      - visual
      - data
    url: /fr/services/[full_slug]/
    preview:
      icon: rocket_launch
      text:
        - key: title
        - text: Service sans titre
      subtext:
        - key: description
    # « + Ajouter » : gabarit de la langue (patron de la collection forms).
    # Flux de traduction : créer (ou Dupliquer) le même nom de fichier dans
    # l'autre collection Services.
    schemas:
      default:
        name: Service (FR)
        icon: rocket_launch
        path: schemas/service-fr.json
        remove_extra_inputs: false
        create:
          path: '{title|slugify}.json'
    _inputs: &services_inputs
      title:
        type: text
        options:
          empty_type: string
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO). Selon le contexte, sert aussi de
          libellé à certaines sections ou cartes.
      slug:
        type: text
        options:
          empty_type: string
        label: Adresse de la page (segments d'URL)
        comment: >-
          Segment(s) après /<langue>/services/ (ex. cybersecurity/zero-trust ;
          les « / » font un service imbriqué). FR : vide = le chemin du
          fichier (cas normal). EN : À RENSEIGNER sur chaque page — l'aperçu
          CloudCannon et l'éditeur visuel suivent ce champ (vide = aperçu
          cassé, l'adresse retombe sur le chemin du fichier). Le NOM DE
          FICHIER reste ce qui apparie FR et EN — changer l'adresse ne rompt
          pas la traduction ; changer une adresse déjà publiée exige une
          redirection (collection Redirections).
      description:
        type: textarea
        options:
          empty_type: string
        label: Description
        comment: >-
          Description pour les moteurs de recherche et les partages.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          DÉSACTIVÉ par défaut : un service est une page publique, indexée
          (l'inverse des campagnes). N'activer que pour retirer temporairement
          un service des résultats de recherche.
      seoTitle:
        type: text
        options:
          empty_type: string
        label: Titre SEO (surcharge)
        comment: >-
          Remplace le titre dans l'onglet du navigateur et les résultats
          Google. Vide = le titre de la page.
      seoH1:
        type: text
        options:
          empty_type: string
        label: H1 SEO (optionnel)
        comment: >-
          Le titre H1 lu par les moteurs de recherche. Vide = le grand titre du
          héros est le H1 (défaut). Renseigné = ce texte devient le H1 de la
          page (invisible à l'écran, lu par Google et les lecteurs d'écran) et
          le grand titre passe en H2 : rien ne change visuellement. Un seul H1
          par page.
      # Préremplissage du formulaire Contact (2026-09-17) : tout bouton de
      # la page qui mène à Contact arrive sur un formulaire où ces deux listes
      # sont déjà choisies (plus le libellé du bouton et la page d'origine dans
      # « Précisez votre demande »). Les liens du menu et du pied de page ne
      # sont pas concernés.
      contactSujet:
        type: select
        label: Contact — sujet présélectionné
        comment: >-
          Choix prérempli dans « De quoi souhaitez-vous parler ? » quand un
          visiteur clique un bouton de cette page vers Contact. Vide = « Un projet ».
        options:
          empty_type: string
          allow_empty: true
          values: _select_data.contact_sujets
          value_key: cle
          preview:
            text:
              - key: libelle
      contactService:
        type: select
        label: Contact — service présélectionné
        comment: >-
          Choix prérempli dans « Service » (même mécanique). Vide =
          la famille du service (Cybersécurité, IA, Infonuagique, Services applicatifs, Services gérés).
        options:
          empty_type: string
          allow_empty: true
          values: _select_data.contact_services
          value_key: cle
          preview:
            text:
              - key: libelle
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder le
          héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` = discriminant de section (défini par la palette) — jamais édité.
      type:
        hidden: true

  services_en:
    path: src/content/services/en
    name: Services (EN)
    singular_name: Service
    description: >-
      English service pages, built from sections (like campaigns) but
      PUBLIC and indexable. Sub-folders hold a service's child pages
      (e.g. productivite/o-bureau). The URL follows the « Adresse de la
      page » field (slug) — required on every EN page. The same file name
      in « Services (FR) » links the translation.
    icon: rocket_launch
    # Éditeur visuel par défaut (première valeur — voir le commentaire de la
