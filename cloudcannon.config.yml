        icon: link
        preview:
          icon: link
          text:
            - key: label
            - text: Lien de navigation
        value:
          label: ''
          # Un lien porte SOIT href SOIT service (P-07, méga-menu dynamique E.3) —
          # voir l'aide du champ « Service » (_inputs.service). Cette structure
          # sert AUSSI les liens des colonnes du méga-menu (_inputs.links).
          href: ''
          service: ''

  # ---------------------------------------------------------------------------
  # Collection « Textes du site » (2026-08-11) — pied de page et 404.
  # ---------------------------------------------------------------------------

  # Lien simple {label, href} : liens d'une colonne de pied de page, réseaux
  # sociaux, mentions légales. Href SANS préfixe de langue (sauf réseaux
  # sociaux : URL externe complète, ou « # » tant qu'elle n'est pas fournie).
  site_links:
