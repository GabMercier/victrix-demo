      apercu: /images/cms/fonds/beige.svg
    - cle: sable
      libelle: Sable (grège)
      couleur: '#e9e2d9'
      apercu: /images/cms/fonds/sable.svg
    - cle: pierre
      libelle: Pierre (grège soutenu)
      couleur: '#dcd5cc'
      apercu: /images/cms/fonds/pierre.svg
  # Palette ÉTENDUE (2026-09-21) : les 10 fonds clairs + les fonds SOMBRES.
  # Réservée aux sections qui inversent leurs textes (texte enrichi, encadré,
