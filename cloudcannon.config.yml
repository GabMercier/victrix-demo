# CloudCannon configuration — landing-pages ("campagnes") editing spike.
#
# Scope: makes this repo editable in CloudCannon (sidebar collections + the
# visual editor for section-based campaign pages). Sveltia (public/admin/)
# REMAINS the CMS for blog + home until the spike gate passes — do not remove
# it. Editor-facing labels/comments below are French (FR-CA editors).
#
# Keep FOUR things in sync when the landing contract changes:
#   1. the Zod schema in src/content.config.ts (frozen landing contract),
#   2. the Bookshop components in component-library/src/components/,
#   3. the per-component *.bookshop.yml specs (structures tag `sections` +
#      blueprint = the palette entry; `npx @bookshop/generate` turns them into
#      the `_structures.sections` values at build time — see _structures below),
#   4. the schema templates in schemas/ (default front matter for new files).
#
# CloudCannon build settings (configured in the CloudCannon UI, NOT here):
#   - build command runs with STATIC_ONLY=1 (adapter-less, fully static build);
#   - `npx @bookshop/generate` runs as the postbuild step so the visual editor
#     can render the Bookshop components live and populate the sections palette.

# NO `source` key on purpose: the SSG source is the repo root (package.json +
# astro.config.mjs live there), so CloudCannon's default (empty) Source Folder
# is correct — same convention as CloudCannon's official Astro starter, where
# collection paths carry the src/ prefix instead. A `source: src` would build
# from a folder with no package.json and hide component-library/ (and the
# bookshop.config.cjs glob of `npx @bookshop/generate`) from CloudCannon.

# Global upload fallback. Without a top-level `paths.uploads`, any upload from
# an input that doesn't declare its own `options.paths.uploads` (e.g. the
# Source/Content Editor's inline image button, or a future _input with no
# explicit path) lands in a root-level `uploads/` folder — how
# uploads/yw3ziw8k83bh1.jpeg got there during spike testing. The blog cover and
# home-page image inputs below already set their own `options.paths.uploads`
# (they need per-collection relative paths for Astro's image() resolver) and
# are UNCHANGED by this — a collection-level path always wins over the global
# one. This only catches uploads that would otherwise have no configured home.
paths:
  uploads: src/assets/uploads

collections_config:
  blog:
    path: src/content/blog
    name: Blogue
    singular_name: Article
    description: >-
      Articles du blogue. Les dossiers fr/ et en/ contiennent les deux
      langues ; le même nom de fichier dans les deux dossiers relie une
      traduction à l'autre.
    icon: post_add
    # Editing interfaces. The FIRST value is the editor a file OPENS IN by
    # default (documented in CloudCannon's "Set a default editing interface"
    # article — the reference page for _enabled_editors only covers the
    # enable/disable part). Listing values DISABLES every unlisted interface;
    # the Source Editor can never be disabled. Blog = long-form writing →
    # Content Editor first, Visual Editor second for an in-template preview.
    _enabled_editors:
      - content
      - visual
    # Preview/output URL. [relative_base_path] = the path under the collection
    # folder, i.e. the locale segment ("fr" | "en"); {slug} is a DATA
    # placeholder (curly braces) reading the per-locale `slug` front matter.
    # EVERY post now carries an explicit `slug` (FR = the filename, EN = the
    # English slug — see src/i18n/blog.ts postUrlSlug), so this template is
    # exact for both locales. New posts created from the schemas below start
    # with slug: "" — their preview link is wrong until the editor fills it in
    # (the schema comment says so); the built site falls back to the filename.
    url: /[relative_base_path]/ressources/{slug}/
    # "+ Ajouter" templates. One schema per locale so a new file ALWAYS lands
    # inside fr/ or en/ (a root-level file would silently map to /fr/ in
    # src/pages/[lang]/ressources/[slug].astro) and always starts with front
    # matter that satisfies the Zod blog schema (an empty file would break the
    # next build of the commit CloudCannon pushes). Translation pairing
    # workflow: create (or Duplicate) the same filename in the other locale
    # folder. Schema `path`s are relative to the repo root; `create.path`s are
    # relative to the collection path.
    schemas:
      default:
        name: Article (FR)
        icon: post_add
        path: schemas/blog-fr.md
        create:
          path: 'fr/{title|slugify}.md'
      en:
        name: Article (EN)
        icon: post_add
        path: schemas/blog-en.md
        create:
          path: 'en/{title|slugify}.md'
    # French labels mirroring the Sveltia config (public/admin/config.yml —
    # read-only reference), so CloudCannon is no step down from Sveltia.
    _inputs:
      title:
        type: text
        label: Titre
      slug:
        type: text
        label: Slug (URL)
        comment: >-
          Segment d'URL propre à la langue. FR : reprendre le nom de fichier ;
          EN : slug anglais (ex. ai-for-organizational-productivity). Requis
          pour que le lien d'aperçu CloudCannon soit exact.
      date:
        type: date
        label: Date de publication
        comment: Format AAAA-MM-JJ.
      # Matches the `draft` field of the blog Zod schema (default false).
      # Visibility rule lives in src/i18n/blog.ts (filterPublished): drafts
      # are excluded from the public site but KEPT in STATIC_ONLY builds —
      # i.e. exactly the CloudCannon editing build — so editors can preview.
      draft:
        type: switch
        label: Brouillon
        comment: >-
          Activé : l'article n'apparaît que dans l'aperçu de l'éditeur
          (build CloudCannon), jamais sur le site public — ni page, ni
          listes. Désactiver pour publier.
      excerpt:
        type: textarea
        label: Extrait
      coverImage:
        type: image
        label: Image de couverture
        comment: >-
          Partagée entre les deux langues — téléverser une seule fois, le même
          fichier sert au FR et à l'EN.
        options:
          paths:
            # Covers live beside the locale folders; the SAVED value must stay
            # relative to the article file ("../covers/<fichier>") so Astro's
            # image() resolver keeps working — hence uploads_use_relative_path.
            # First in-editor upload → build must be tested end-to-end before
            # the spike gate (criterion 4).
            uploads: /src/content/blog/covers
            uploads_use_relative_path: true
      tags:
        type: array
        label: Étiquettes

  home:
    path: src/content/home
    name: Accueil
    description: >-
      Contenu de la page d'accueil (fichier unique — modifier seulement, ne
      pas ajouter ni supprimer de fichier).
    icon: home
    # Singleton JSON: editors may only edit the existing file.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    # fr/accueil.json → /fr/, en/accueil.json → /en/ — opening the file lands
    # in the VISUAL editor next to the real homepage (criterion 1), instead of
    # the bare data editor a disable_url data collection would get.
    url: /[relative_base_path]/
    # First value = default editor (see the blog collection's comment for the
    # doc reference). Visual first — GUARANTEES criterion 1 instead of relying
    # on CloudCannon's heuristic; Data second as the flat-JSON fallback. No
    # `content`: these are JSON files, there is no markdown body to edit.
    _enabled_editors:
      - visual
      - data
    # French labels mirroring public/admin/config.yml. Inputs are keyed by
    # FIELD NAME and cascade into nested objects — shared names (title,
    # ctaLabel…) get ONE generic config on purpose.
    # The home is now composed of `sections` (migrated from the old nested data
    # object — see scripts/migrate-home-to-sections.mjs), edited visually like
    # the campaign landings through the SHARED `sections` palette. Inputs are
    # keyed by FIELD NAME and cascade into the section objects/arrays; the
    # per-section polish (labels, hidden `type`) lives in each home-*.bookshop.yml
    # spec, which @bookshop/generate copies onto the palette entries (that
    # "containing structure" level outranks these collection-level fallbacks).
    _inputs:
      sections:
        type: array
        label: Sections
        comment: >-
          L'accueil est construit uniquement à partir de ces sections. Garder la
          bannière en PREMIÈRE position : elle porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` = discriminant de section (défini par la palette) — jamais édité.
      type:
        hidden: true
      title:
        type: text
        label: Titre
      subtitle:
        type: textarea
        label: Sous-titre
      eyebrow:
        type: text
        label: Surtitre
      ctaLabel:
        type: text
        label: Texte du bouton
      ctaHref:
        type: text
        label: Lien du bouton
        comment: >-
          URL finale, préfixe de langue inclus (ex. /fr/decouvrir) — les
          sections sont rendues telles quelles, sans ajout du préfixe.
      sectionTitle:
        type: text
        label: Titre de section
      learnMore:
        type: text
        label: Libellé du bouton des cartes
      body:
        type: textarea
        label: Texte
      # Cartes d'expertise (tableau `items` de la section « Expertises »).
      items:
        type: array
        label: Cartes d'expertise
        options:
          structures: _structures.expertise_items
      number:
        type: text
        label: Numéro
      accent:
        type: text
        label: Couleur d'accent (hex)
        # Quoted: an unquoted # would start a YAML comment mid-value.
        comment: "Ex. #B45309 — garder un bon contraste sur fond blanc."
      description:
        type: textarea
        label: Description
      href:
        type: text
        label: Lien
      names:
        type: array
        label: Noms des partenaires
      image:
        type: image
        label: Image
        options:
          paths:
            # Images live beside the locale folders (src/content/home); the
            # SAVED value must stay relative to the JSON file ("../<fichier>")
            # for Astro's image() resolver — hence uploads_use_relative_path.
            uploads: /src/content/home
            uploads_use_relative_path: true

  # Expertise pages (per-locale JSON, like home) — src/content/expertises.
  # Today: intelligence-artificielle only (migrated out of the old
  # src/i18n/content/ai.ts so criterion 1's third target is editable here).
  expertises:
    path: src/content/expertises
    name: Expertises
    singular_name: Expertise
    description: >-
      Contenu des pages d'expertise (FR + EN). Modifier seulement — la mise en
      page appartient au gabarit Astro correspondant.
    icon: psychology
    # The page template is hand-built per expertise — adding a JSON here does
    # NOT create a page, so keep add/delete disabled.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    # fr/intelligence-artificielle.json → /fr/expertises/intelligence-artificielle/
    url: /[relative_base_path]/expertises/[slug]/
    # Same rationale as home: Visual by default (first value), Data as the
    # flat-JSON fallback, no markdown body so no `content`.
    _enabled_editors:
      - visual
      - data
    _inputs:
      metaTitle:
        type: text
        label: Titre (SEO)
      metaDescription:
        type: textarea
        label: Description (SEO)
      hero:
        type: object
        label: Bannière (hero)
      titleAccent:
        type: text
        label: Début du titre (accentué)
      titleRest:
        type: text
        label: Suite du titre
      lead:
        type: textarea
        label: Paragraphe d'introduction
        comment: Peut contenir des <strong> (rendu HTML tel quel).
      eyebrow:
        type: text
        label: Surtitre
      cta:
        type: text
        label: Libellé du bouton
      fromStrategy:
        type: object
        label: Bloc « de la stratégie à l'adoption »
      blockTitle:
        type: text
        label: Titre du bloc
      leadCardTitle:
        type: text
        label: Titre de la carte d'introduction
      leadCardText:
        type: textarea
        label: Texte de la carte d'introduction
      interventions:
        type: array
        label: Interventions
      collaboration:
        type: object
        label: Bloc « collaboration »
      expertsPanel:
        type: object
        label: Bloc « bassin d'experts »
      areas:
        type: object
        label: Domaines d'expertise
      multiTech:
        type: object
        label: Expertise multitechnologique
      closing:
        type: object
        label: Bloc de conclusion
      greenCta:
        type: object
        label: Bandeau vert (appel à l'action)
      cta1:
        type: object
        label: Encadré d'appel à l'action 1
      cta2:
        type: object
        label: Encadré d'appel à l'action 2
      sHead:
        type: text
        label: Titre de section
      sIntro:
        type: textarea
        label: Introduction de section
        comment: Peut contenir des <strong> (rendu HTML tel quel).
      sSub:
        type: text
        label: Sous-titre de section
      items:
        type: array
        label: Éléments
      n:
        type: text
        label: Numéro
      title:
        type: text
        label: Titre
      text:
        type: textarea
        label: Texte
      p1:
        type: textarea
        label: Premier paragraphe
        comment: Peut contenir des <strong> (rendu HTML tel quel).
      p2:
        type: textarea
        label: Deuxième paragraphe
        comment: Peut contenir des <strong> (rendu HTML tel quel).
      col1Title:
        type: text
        label: Titre de la colonne 1
      col2Title:
        type: text
        label: Titre de la colonne 2
      col3Title:
        type: text
        label: Titre de la colonne 3
      openLocalLabel:
        type: text
        label: Libellé « sources ouvertes et locales »

  landing:
    path: src/content/landing
    name: Campagnes
    singular_name: Campagne
    description: >-
      Pages d'atterrissage de campagne, bâties par sections (héros, bénéfices,
      appel à l'action, formulaire). Les dossiers fr/ et en/ contiennent les
      deux langues ; le même nom de fichier relie une traduction à l'autre.
    icon: campaign
    # First value = default editor (doc reference in the blog collection's
    # comment). Campaign pages are section-built → Visual Editor first (live
    # Bookshop rendering is the whole point of the spike); Content Editor
    # second for quick front-matter/SEO edits without the preview.
    _enabled_editors:
      - visual
      - content
    # Same [relative_base_path] trick as blog: the locale folder becomes the
    # URL prefix. Landing has no per-locale `slug` frontmatter (yet) — the
    # filename IS the URL slug in both locales, so this template is exact.
    url: /[relative_base_path]/campagnes/[slug]/
    # "+ Ajouter" templates — same rationale as blog: force the fr/ or en/
    # folder (a root-level file would collide into /fr/ in the campagnes
    # getStaticPaths) and start from front matter that SATISFIES the frozen
    # landing contract (title + sections required — an empty file would break
    # the build of the commit CloudCannon pushes). Translation pairing
    # workflow: create (or Duplicate) the same filename in the other folder.
    schemas:
      default:
        name: Campagne (FR)
        icon: campaign
        path: schemas/landing-fr.md
        create:
          path: 'fr/{title|slugify}.md'
      en:
        name: Campaign (EN)
        icon: campaign
        path: schemas/landing-en.md
        create:
          path: 'en/{title|slugify}.md'
    # Collection card shown in the CloudCannon file browser.
    preview:
      icon: campaign
      text:
        - key: title
        - text: Campagne sans titre
      subtext:
        - key: description
    # Inputs are keyed by FIELD NAME and cascade into nested objects/arrays of
    # this collection — a name shared across levels (title, description) gets
    # ONE config, so those labels/comments stay generic on purpose.
    _inputs:
      title:
        type: text
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO), d'une section ou d'une carte,
          selon le contexte.
      description:
        type: textarea
        label: Description
        comment: >-
          Au niveau de la page : description pour les moteurs de recherche et
          les partages. Dans une carte « Bénéfices » : le texte de la carte.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          Activé par défaut : les pages de campagne (trafic payant) restent
          hors des résultats de recherche. Désactiver seulement si la page
          doit être indexée.
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder
          le héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` is the section discriminator (set by the palette) — never
      # hand-edited, so it cascades to hidden for every input named `type` in
      # this collection. The INNER `type` of a form field is re-exposed at a
      # MORE SPECIFIC cascade level: _structures.form_fields.values[0]._inputs
      # below (the containing structure outranks collection-level _inputs).
      # CloudCannon has NO bracketed path-key syntax ("fields[*].type" was
      # inert config) — plain input names only.
      type:
        hidden: true
      eyebrow:
        type: text
        label: Surtitre
        comment: Petit libellé affiché au-dessus du titre du héros (optionnel).
      subtitle:
        type: textarea
        label: Sous-titre
      intro:
        type: textarea
        label: Introduction
        comment: Court paragraphe sous le titre de la section (optionnel).
      body:
        type: textarea
        label: Texte
      ctaLabel:
        type: text
        label: Libellé du bouton
      ctaHref:
        type: text
        label: Lien du bouton
        comment: >-
          URL finale, préfixe de langue inclus (ex. « /fr/contact ») — les
          sections sont rendues telles quelles, sans ajout du préfixe.
      variant:
        type: select
        label: Variante
        comment: « light » = bande pâle ; « dark » = bande marine foncée.
        options:
          values:
            - light
            - dark
      items:
        type: array
        label: Cartes
        options:
          structures: _structures.benefit_items
      fields:
        type: array
        label: Champs du formulaire
        comment: >-
          Maquette non fonctionnelle : rien n'est envoyé ni collecté (le
          backend de formulaires est un chantier séparé, à venir).
        options:
          structures: _structures.form_fields
      submitLabel:
        type: text
        label: Libellé du bouton d'envoi
      consentText:
        type: textarea
        label: Texte de consentement
        comment: >-
          Mention affichée sous les champs (ex. consentement Loi 25 sur la
          protection des renseignements personnels).
      label:
        type: text
        label: Libellé du champ
      required:
        type: switch
        label: Champ obligatoire
      # FAQ section fields (cascade — only the FAQ items use these names).
      question:
        type: text
        label: Question
      answer:
        type: textarea
        label: Réponse
        comment: >-
          Texte simple, sans HTML — la réponse est aussi publiée en données
          structurées FAQPage (JSON-LD) pour les moteurs de recherche.

  # URL redirects — exposes src/data/redirects.json, which the inline
  # 'victrix:redirects' integration in astro.config.mjs turns into
  # dist/_redirects (Cloudflare Pages format) at build time. A COLLECTION on
  # the data folder is the documented way to make a data file editable in the
  # sidebar ("Data folders function as collections by setting their path to a
  # data directory") — `data_config` would NOT work here: its only documented
  # purpose is feeding Select/Multiselect options, it creates no sidebar entry.
  redirects:
    path: src/data
    # Only redirects.json is editable — the glob hides any other data file
    # that later lands in src/data/.
    glob:
      - redirects.json
    name: Redirections
    singular_name: Redirection
    description: >-
      Redirections d'URL (ex. anciennes adresses WordPress vers les nouvelles
      pages). ATTENTION : une entrée invalide — chemin sans « / » initial,
      destination vide, doublon, redirection vers soi-même — fait échouer le
      build. C'est un garde-fou volontaire : l'erreur de build nomme l'entrée
      à corriger, rien de cassé n'atteint le site.
    icon: alt_route
    # Single dev-owned file: no add/delete/rename, and no preview URL (the
    # JSON is not a page).
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    disable_url: true
    # Data Editor only (and it opens by default — first value). The file is a
    # root-level JSON array: supported by the Data Editor, but the array has
    # no field NAME, so no _inputs/_structures can target the array itself —
    # only its item fields below. The Data Editor's "+" clones the shape of
    # existing rows, so the seeded /demo-redirection entry doubles as the row
    # template: never empty the file completely.
    _enabled_editors:
      - data
    _inputs:
      de:
        type: text
        label: Ancienne URL
        comment: >-
          Chemin commençant par « / » (ex. /demo-redirection), sans domaine.
      vers:
        type: text
        label: Nouvelle destination
        comment: >-
          Chemin du site (ex. /fr/) ou URL complète (https://…).
      code:
        type: select
        label: Type de redirection
        comment: >-
          301 = permanente (transfère le référencement) ; 302 = temporaire.
        options:
          # STRING values — settled empirically 2026-07-15: the Data Editor
          # rejects numeric select values outright ("This select input is
          # misconfigured. This input must have a text value."), exactly the
          # risk the round-2 review flagged. The editor therefore saves
          # "code": "301" (string) into redirects.json; the build validator
          # (astro.config.mjs, 'victrix:redirects') accepts the exact strings
          # "301"/"302" and normalizes them to numbers for _redirects output.
          # Anything else (303, free text…) still fails the build loudly —
          # that's the guardrail. The seed entry uses the string form too so
          # the select shows it as selected (a numeric 301 would not match).
          values:
            - "301"
            - "302"

  # Formulaires réutilisables (« forms v2 ») — un JSON par formulaire dans
  # src/data/forms/fr|en/ (même nom de fichier = paire de traduction). Une
  # section « Formulaire » d'une page les référence par leur identifiant (nom
  # du fichier sans .json). LE DESTINATAIRE EST DÉFINI ICI, jamais dans la
  # page : côté serveur, /api/forms résout destinataire/objet/champs depuis un
  # registre embarqué au build (liste blanche) — le navigateur n'envoie qu'un
  # identifiant. Validé au build (collection `forms`, src/content.config.ts).
  forms:
    path: src/data/forms
    name: Formulaires
    singular_name: Formulaire
    description: >-
      Définitions de formulaires réutilisables (destinataire, objet, champs).
      Les dossiers fr/ et en/ contiennent les deux langues ; le même nom de
      fichier relie une traduction à l'autre. Les pages y font référence par
      l'identifiant (nom du fichier sans .json).
    icon: dynamic_form
    # Pas de page à prévisualiser (le JSON n'est pas une page).
    disable_url: true
    # Éditeur de données uniquement (JSON structuré, pas de corps markdown).
    _enabled_editors:
      - data
    # « + Ajouter » : un gabarit par langue pour que le fichier atterrisse dans
    # fr/ ou en/ avec un JSON valide (même logique que blog/landing).
    schemas:
      default:
        name: Formulaire (FR)
        icon: dynamic_form
        path: schemas/form-fr.json
        create:
          path: 'fr/{name|slugify}.json'
      en:
        name: Formulaire (EN)
        icon: dynamic_form
        path: schemas/form-en.json
        create:
          path: 'en/{name|slugify}.json'
    _inputs:
      name:
        type: text
        label: Nom (interne)
        comment: Affiché aux éditeurs seulement — jamais aux visiteurs.
      toEmail:
        type: text
        label: Courriel destinataire
        comment: >-
          Adresse qui reçoit les soumissions de CE formulaire. Vide = le
          destinataire global du site (variable FORMS_TO_EMAIL).
      subject:
        type: text
        label: Objet du courriel
        comment: Vide = objet générique.
      submitLabel:
        type: text
        label: Libellé du bouton d'envoi
      consentText:
        type: textarea
        label: Texte de consentement
        comment: Mention Loi 25 affichée au-dessus du bouton (optionnelle).
      fields:
        type: array
        label: Champs
        comment: >-
          Le nom technique de chaque champ dérive de son libellé — éviter deux
          libellés identiques dans un même formulaire.
        options:
          structures: _structures.form_fields
      label:
        type: text
        label: Libellé du champ
      required:
        type: switch
        label: Champ obligatoire

  # Navigation du site (menu principal, méga-menu, barre d'annonce, bouton
  # portail) — un JSON par langue dans src/data/navigation, consommé par
  # src/components/Header.astro et validé au build par la collection
  # `navigation` (src/content.config.ts) : un lien invalide fait échouer le
  # build en nommant le fichier fautif. ATTENTION CONVENTION : les liens
  # internes sont stockés SANS préfixe de langue (/contact, pas /fr/contact) —
  # le gabarit ajoute /fr ou /en au rendu. C'est l'INVERSE des sections de
  # page (ctaHref = URL finale) ; les commentaires des champs le rappellent.
  navigation:
    path: src/data/navigation
    name: Navigation
    singular_name: Navigation
    description: >-
      Menu principal, méga-menu, barre d'annonce et bouton du portail (un
      fichier par langue). Liens internes SANS préfixe de langue (ex.
      /contact) — le site ajoute /fr ou /en automatiquement.
    icon: menu
    # Two dev-owned files (fr.json / en.json): no add/delete/rename, and no
    # preview URL (the JSON is not a page).
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    disable_url: true
    # Data Editor only (opens by default — first value). These are structured
    # JSON files with no markdown body.
    _enabled_editors:
      - data
    _inputs:
      items:
        type: array
        label: Menu principal
        comment: Entrées du menu d'en-tête, dans l'ordre d'affichage.
        options:
          structures: _structures.nav_links
      portal:
        type: object
        label: Bouton « Portail client »
      visible:
        type: switch
        label: Visible
      mega:
        type: object
        label: Méga-menu
        comment: >-
          S'attache à l'entrée du menu principal dont le lien est identique au
          « Lien parent » ci-dessous.
      parentHref:
        type: text
        label: Lien parent
        comment: >-
          Doit correspondre au lien d'une entrée du menu principal (ex.
          /expertises).
      ariaLabel:
        type: text
        label: Libellé d'accessibilité
      columns:
        type: array
        label: Colonnes
        options:
          structures: _structures.nav_columns
      links:
        type: array
        label: Liens
        options:
          structures: _structures.nav_links
      icon:
        type: select
        label: Icône
        comment: >-
          Icônes disponibles (dessinées dans le gabarit d'en-tête — en ajouter
          une est une tâche développeur).
        options:
          values:
            - strategy
            - cloud
            - security
            - productivity
            - managed
      announce:
        type: object
        label: Barre d'annonce
      enabled:
        type: switch
        label: Affichée
        comment: Désactivé = la barre d'annonce disparaît du site.
      before:
        type: text
        label: Texte (avant la partie en gras)
      strong:
        type: text
        label: Partie en gras
      after:
        type: textarea
        label: Texte (après la partie en gras)
      linkLabel:
        type: text
        label: Libellé du lien
      linkHref:
        type: text
        label: Lien de l'annonce
        comment: Sans préfixe de langue (ex. /produits).
      label:
        type: text
        label: Libellé
      href:
        type: text
        label: Lien
        comment: >-
          Sans préfixe de langue (ex. /contact), ou URL https:// complète.

_structures:
  # Section palette for the landing `sections` array. The VALUES are NOT
  # written here: the CloudCannon postbuild `npx @bookshop/generate` appends
  # one entry per component tagged `spec.structures: [sections]` in
  # component-library/**/*.bookshop.yml, each carrying `_bookshop_name` as the
  # matching key (generate hard-sets `id_key: _bookshop_name` and APPENDS to
  # any existing values — verified in @bookshop/generate/lib/
  # structure-connector.js — so hand-written values would only duplicate every
  # palette entry under a mismatched id_key). Labels/descriptions/icons and
  # picker polish live in the *.bookshop.yml specs; the seeded .md files carry
  # `_bookshop_name` on each section so existing data matches the generated
  # values. Only the keys below are OURS — generate preserves them.
  sections:
    # Card-picker modal when adding a section (nicer than a plain select).
    style: modal
    # CloudCannon's visual editor adds a `_bookshop_name` key to inserted
    # components; the default remove_extra_inputs: true would strip it (and
    # any future undeclared key) on edit — keep every key intact instead.
    remove_extra_inputs: false

  # Uniform sub-arrays: a single-value structure gives the "add" button the
  # right shape even when the array starts empty. NOT tagged in any Bookshop
  # spec, so generate leaves these untouched.
  #
  # Default values use EMPTY STRINGS ("") instead of blank YAML values: blank
  # parses to null, and null fails the Zod `.optional()` string fields mid-edit.
  benefit_items:
    values:
      - label: Carte bénéfice
        icon: check_circle
        preview:
          icon: check_circle
          text:
            - key: title
            - text: Carte bénéfice
        value:
          title: ''
          description: ''

  # Cartes d'expertise ({number,title,accent,description,href}) pour la section
  # « Accueil — Expertises ». Même logique que benefit_items : une structure à
  # valeur unique donne au bouton « + » la bonne forme, même sur un tableau
  # vide. Non taguée dans un spec Bookshop → generate n'y touche pas.
  expertise_items:
    values:
      - label: Carte d'expertise
        icon: category
        preview:
          icon: category
          text:
            - key: title
            - text: Carte d'expertise
        value:
          number: ''
          title: ''
          accent: '#2350E0'
          description: ''
          href: ''

  form_fields:
    values:
      - label: Champ de formulaire
        icon: edit_note
        preview:
          icon: edit_note
          text:
            - key: label
            - text: Champ de formulaire
        # Forme COMPLÈTE (P-05) : les clés étendues sont présentes avec des
        # « formes vides » — options: [], value: '', showIf {field:'',…} —
        # jamais null (un null casserait les .optional() zod en cours
        # d'édition, voir l'entête _structures). Une clé laissée vide signifie
        # simplement « sans objet pour ce type de champ ».
        value:
          label: ''
          type: text
          required: true
          options: []
          value: ''
          showIf:
            field: ''
            equals: ''
        # Structure values support their own _inputs, and the "containing
        # structure" level outranks the landing collection's _inputs in the
        # configuration cascade — this re-exposes the form-field `type` select
        # that the collection-level `type: hidden` (section discriminator)
        # would otherwise hide. Les _inputs des clés étendues (options/value/
        # showIf/field/equals) vivent AUSSI ici pour rester scopés aux champs
        # de formulaire.
        _inputs:
          type:
            type: select
            label: Type de champ
            comment: >-
              text = texte court · email = courriel · tel = téléphone ·
              textarea = texte long · select = liste déroulante · checkbox =
              case à cocher (ex. consentement Loi 25) · hidden = champ caché.
              Les clés « Options », « Valeur (champ caché) » et « Condition
              d'affichage » ne s'appliquent qu'aux types indiqués dans leur
              description.
            options:
              values:
                - text
                - email
                - tel
                - textarea
                - select
                - checkbox
                - hidden
          options:
            type: array
            label: Options (liste déroulante)
            comment: >-
              Type « select » seulement — au moins une option; éviter les
              virgules dans le texte d'une option. Ignoré pour les autres
              types.
          # Type d'entrée du tableau (notation documentée `nom[*]`) : sans
          # lui, un tableau VIDE est « misconfigured » — CloudCannon ne sait
          # pas quoi créer au « + Ajouter » (le clonage exige une entrée
          # existante). Chaque option est une simple chaîne.
          options[*]:
            type: text
            label: Option
          value:
            type: text
            label: Valeur (champ caché)
            comment: >-
              Type « hidden » seulement. Jetons remplacés à la publication :
              {{page.titre}}, {{page.chemin}}, {{page.slug}}, {{page.langue}}.
              Un jeton {{url.utm_source}} (ou tout autre {{url.…}}, seul dans
              la valeur) est rempli dans le navigateur du visiteur depuis
              l'adresse de la page.
          showIf:
            type: object
            label: Condition d'affichage
            comment: >-
              Laisser vide = champ toujours affiché. Sinon, le champ ne
              s'affiche que si le champ pilote a la valeur attendue (le
              serveur n'exige alors ce champ que lorsque la condition est
              remplie).
          field:
            type: text
            label: Champ pilote (libellé exact)
            comment: >-
              Recopier EXACTEMENT le libellé d'une liste déroulante ou d'une
              case à cocher du même formulaire. Une faute de frappe bloque la
              publication avec un message clair.
          equals:
            type: text
            label: Valeur attendue
            comment: >-
              Une option de la liste pilote, ou « oui » pour une case à
              cocher.

  # Partenaires ({name, logo, description}) pour la section « Bandeau logos
  # partenaires » (logo-banner). Même GOTCHA que faq_items : le tableau
  # s'appelle AUSSI `items`, le spec logo-banner.bookshop.yml re-pointe son
  # `items` vers CETTE structure.
  logo_items:
    values:
      - label: Partenaire
        icon: workspaces
        preview:
          icon: workspaces
          text:
            - key: name
            - text: Partenaire
        value:
          name: ''
          logo: ''
          description: ''

  # Chiffres ({number, label}) pour la section « Victrix en chiffres » (stats).
  # Même GOTCHA `items` que ci-dessus — re-pointé par stats.bookshop.yml.
  stat_items:
    values:
      - label: Chiffre
        icon: insights
        preview:
          icon: insights
          text:
            - key: number
            - text: Chiffre
        value:
          number: ''
          label: ''

  # Navigation (collection « navigation ») : formes des tableaux du menu.
  # Même logique que benefit_items — une structure à valeur unique donne au
  # bouton « + » la bonne forme, même sur un tableau vide. Non taguées dans un
  # spec Bookshop → generate n'y touche pas.
  nav_links:
    values:
      - label: Lien de navigation
        icon: link
        preview:
          icon: link
          text:
            - key: label
            - text: Lien de navigation
        value:
          label: ''
          href: ''

  nav_columns:
    values:
      - label: Colonne du méga-menu
        icon: view_column
        preview:
          icon: view_column
          text:
            - key: title
            - text: Colonne du méga-menu
        value:
          title: ''
          href: ''
          icon: strategy
          links: []

  # FAQ items ({question, answer} pairs) for the « FAQ » Bookshop section.
  # GOTCHA: the FAQ array is ALSO named `items` (frozen contract), and the
  # collection-level `_inputs.items` above binds every `items` array to
  # _structures.benefit_items — the WRONG shape here. faq.bookshop.yml must
  # therefore re-point its own `items` at THIS structure via a spec-level
  # `_inputs.items` (type: array + options.structures: _structures.faq_items):
  # generate copies spec _inputs onto the palette entry, and that "containing
  # structure" level outranks the collection's — the exact mechanism already
  # used by form_fields to re-expose the field `type` select.
  faq_items:
    values:
      - label: Question / réponse
        icon: quiz
        preview:
          icon: quiz
          text:
            - key: question
            - text: Question / réponse
        value:
          question: ''
          answer: ''
