# CloudCannon configuration — l'éditeur du site (CloudCannon est LE CMS;
# Sveltia a été retiré le 2026-07-30, Phase 3 du plan de convergence).
#
# Scope: makes this repo editable in CloudCannon (sidebar collections + the
# visual editor for section-based pages). Editor-facing labels/comments below
# are French (FR-CA editors).
#
# Keep FOUR things in sync when the landing contract changes:
#   1. the Zod schema in src/content.config.ts (frozen landing contract),
#   2. the Bookshop components in component-library/src/components/,
#   3. the per-component *.bookshop.yml specs (structures tag `sections` +
#      blueprint = the palette entry; `npx @bookshop/generate` turns them into
#      the `_structures.sections` values at build time — see _structures below),
#   4. the schema templates in schemas/ (default front matter for new files).
#
# CloudCannon build settings (configured in the CloudCannon UI, NOT here):
#   - build command runs with STATIC_ONLY=1 (adapter-less, fully static build);
#   - `npx @bookshop/generate` runs as the postbuild step so the visual editor
#     can render the Bookshop components live and populate the sections palette.

# NO `source` key on purpose: the SSG source is the repo root (package.json +
# astro.config.mjs live there), so CloudCannon's default (empty) Source Folder
# is correct — same convention as CloudCannon's official Astro starter, where
# collection paths carry the src/ prefix instead. A `source: src` would build
# from a folder with no package.json and hide component-library/ (and the
# bookshop.config.cjs glob of `npx @bookshop/generate`) from CloudCannon.

# Global upload fallback. Without a top-level `paths.uploads`, any upload from
# an input that doesn't declare its own `options.paths.uploads` (e.g. the
# Source/Content Editor's inline image button, or a future _input with no
# explicit path) lands in a root-level `uploads/` folder — how
# uploads/yw3ziw8k83bh1.jpeg got there during spike testing. The blog cover and
# home-page image inputs below already set their own `options.paths.uploads`
# (they need per-collection relative paths for Astro's image() resolver) and
# are UNCHANGED by this — a collection-level path always wins over the global
# one. This only catches uploads that would otherwise have no configured home.
paths:
  uploads: src/assets/uploads

# Barre latérale organisée pour l'équipe marketing (demande utilisateur
# 2026-07-30) : le CONTENU du site d'abord, les outils marketing ensuite, la
# configuration à la fin. Une collection absente d'un groupe resterait visible
# sous « Autres » — garder cette liste alignée sur collections_config.
collection_groups:
  - heading: Contenu du site
    collections:
      - home
      - pages
      - services
      - solutions
      - blog
      - contact
      - carrieres
      - site
      - pagesSysteme
  - heading: Marketing
    collections:
      - landing
      - forms
      - navigation
  - heading: Configuration
    collections:
      - redirects

collections_config:
  blog:
    path: src/content/blog
    name: Blogue
    singular_name: Article
    description: >-
      Articles du blogue. Les dossiers fr/ et en/ contiennent les deux
      langues ; le même nom de fichier dans les deux dossiers relie une
      traduction à l'autre.
    icon: post_add
    # Editing interfaces. The FIRST value is the editor a file OPENS IN by
    # default (documented in CloudCannon's "Set a default editing interface"
    # article — the reference page for _enabled_editors only covers the
    # enable/disable part). Listing values DISABLES every unlisted interface;
    # the Source Editor can never be disabled. Blog = long-form writing →
    # Content Editor first, Visual Editor second for an in-template preview.
    _enabled_editors:
      - content
      - visual
    # Preview/output URL. [relative_base_path] = the path under the collection
    # folder, i.e. the locale segment ("fr" | "en"); {slug} is a DATA
    # placeholder (curly braces) reading the per-locale `slug` front matter.
    # EVERY post now carries an explicit `slug` (FR = the filename, EN = the
    # English slug — see src/i18n/blog.ts postUrlSlug), so this template is
    # exact for both locales. New posts created from the schemas below start
    # with slug: "" — their preview link is wrong until the editor fills it in
    # (the schema comment says so); the built site falls back to the filename.
    url: /[relative_base_path]/ressources/{slug}/
    # Carte du navigateur de fichiers : couverture + titre + extrait (repli
    # icône quand l'article n'a pas d'image).
    preview:
      icon: post_add
      image:
        - key: coverImage
      text:
        - key: title
        - text: Article sans titre
      subtext:
        - key: excerpt
    # "+ Ajouter" templates. One schema per locale so a new file ALWAYS lands
    # inside fr/ or en/ (a root-level file would silently map to /fr/ in
    # src/pages/[lang]/ressources/[slug].astro) and always starts with front
    # matter that satisfies the Zod blog schema (an empty file would break the
    # next build of the commit CloudCannon pushes). Translation pairing
    # workflow: create (or Duplicate) the same filename in the other locale
    # folder. Schema `path`s are relative to the repo root; `create.path`s are
    # relative to the collection path.
    schemas:
      default:
        name: Article (FR)
        icon: post_add
        path: schemas/blog-fr.md
        create:
          path: 'fr/{title|slugify}.md'
      en:
        name: Article (EN)
        icon: post_add
        path: schemas/blog-en.md
        create:
          path: 'en/{title|slugify}.md'
    # French labels mirroring the Sveltia config (public/admin/config.yml —
    # read-only reference), so CloudCannon is no step down from Sveltia.
    _inputs:
      title:
        type: text
        label: Titre
      slug:
        type: text
        label: Slug (URL)
        comment: >-
          Segment d'URL propre à la langue. FR : reprendre le nom de fichier ;
          EN : slug anglais (ex. ai-for-organizational-productivity). Requis
          pour que le lien d'aperçu CloudCannon soit exact.
      date:
        type: date
        label: Date de publication
        comment: >-
          Format AAAA-MM-JJ. Une date FUTURE programme l'article : il reste
          hors du site public jusqu'au premier build suivant cette date
          (l'aperçu de l'éditeur le montre toujours).
      # Matches the `draft` field of the blog Zod schema (default false).
      # Visibility rule lives in src/i18n/blog.ts (filterPublished): drafts
      # are excluded from the public site but KEPT in STATIC_ONLY builds —
      # i.e. exactly the CloudCannon editing build — so editors can preview.
      draft:
        type: switch
        label: Brouillon
        comment: >-
          Activé : l'article n'apparaît que dans l'aperçu de l'éditeur
          (build CloudCannon), jamais sur le site public — ni page, ni
          listes. Désactiver pour publier.
      excerpt:
        type: textarea
        label: Extrait
        comment: >-
          Sert aussi de description SEO (résultats Google, partages) et de
          texte des cartes du blogue.
      seoTitle:
        type: text
        label: Titre SEO (surcharge)
        comment: >-
          Remplace le titre dans l'onglet du navigateur et les résultats
          Google. Vide = le titre de l'article.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          Activé : l'article reste en ligne mais sort des résultats Google et
          de la recherche interne. Désactivé par défaut.
      wpUrl:
        type: text
        label: Ancienne URL WordPress (référence)
        comment: >-
          Trace de migration — n'affecte pas le site (les redirections se
          gèrent dans la collection Redirections).
      coverImage:
        type: image
        label: Image de couverture
        comment: >-
          Partagée entre les deux langues — téléverser une seule fois, le même
          fichier sert au FR et à l'EN. Optionnelle (article sans image).
        options:
          paths:
            # Contenu migré (2026-07-29) : les couvertures sont des CHEMINS
            # PUBLICS servis tels quels (/wp-content/uploads/… — même
            # convention que les images du corps et des sections, patron
            # identique aux images de la palette : static: public → l'adresse
            # enregistrée commence à /…). Les nouveaux téléversements
            # atterrissent dans public/wp-content/uploads/cms/ (dossier dédié
            # CMS, à l'écart des millésimes WordPress).
            static: public
            uploads: public/wp-content/uploads/cms
      tags:
        type: array
        label: Étiquettes
        comment: >-
          Catégories de l'index du blogue (onglets de filtre + méga-menu
          Ressources). Pour relier l'article aux pages Services, utiliser
          plutôt les Thèmes ci-dessous.
      # Type d'entrée du tableau (notation documentée `nom[*]`) : sans lui,
      # un tableau VIDE est « misconfigured » — CloudCannon ne sait pas quoi
      # créer au « + Ajouter » (même patron que options[*]/items[*] plus bas).
      tags[*]:
        type: text
        label: Étiquette
      topics:
        type: array
        label: Thèmes (maillage Services)
        comment: >-
          Relie l'article aux bandes « Ressources liées » des pages Services.
          Reprendre EXACTEMENT un nom d'expertise : Cybersécurité, Intelligence
          artificielle, Infonuagique, Productivité, Services gérés, Conseil
          stratégique (équivalents anglais dans les fichiers EN). N'alimente
          PAS les filtres du blogue.
      topics[*]:
        type: text
        label: Thème

  home:
    path: src/content/home
    name: Accueil
    description: >-
      Contenu de la page d'accueil (fichier unique — modifier seulement, ne
      pas ajouter ni supprimer de fichier).
    icon: home
    # Singleton JSON: editors may only edit the existing file.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    # fr/accueil.json → /fr/, en/accueil.json → /en/ — opening the file lands
    # in the VISUAL editor next to the real homepage (criterion 1), instead of
    # the bare data editor a disable_url data collection would get.
    url: /[relative_base_path]/
    # Carte du navigateur : le JSON n'a que `sections` au premier niveau — pas
    # de titre à afficher, d'où un libellé statique (le dossier fr/ ou en/
    # distingue les deux fichiers).
    preview:
      icon: home
      text:
        - text: Page d'accueil
      subtext:
        - text: Bannière, expertises, solutions, partenaires…
    # First value = default editor (see the blog collection's comment for the
    # doc reference). Visual first — GUARANTEES criterion 1 instead of relying
    # on CloudCannon's heuristic; Data second as the flat-JSON fallback. No
    # `content`: these are JSON files, there is no markdown body to edit.
    _enabled_editors:
      - visual
      - data
    # French labels mirroring public/admin/config.yml. Inputs are keyed by
    # FIELD NAME and cascade into nested objects — shared names (title,
    # ctaLabel…) get ONE generic config on purpose.
    # The home is now composed of `sections` (migrated from the old nested data
    # object — see scripts/migrate-home-to-sections.mjs), edited visually like
    # the campaign landings through the SHARED `sections` palette. Inputs are
    # keyed by FIELD NAME and cascade into the section objects/arrays; the
    # per-section polish (labels, hidden `type`) lives in each home-*.bookshop.yml
    # spec, which @bookshop/generate copies onto the palette entries (that
    # "containing structure" level outranks these collection-level fallbacks).
    _inputs:
      sections:
        type: array
        label: Sections
        comment: >-
          L'accueil est construit uniquement à partir de ces sections. Garder la
          bannière en PREMIÈRE position : elle porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` = discriminant de section (défini par la palette) — jamais édité.
      type:
        hidden: true
      title:
        type: text
        label: Titre
      subtitle:
        type: textarea
        label: Sous-titre
      eyebrow:
        type: text
        label: Surtitre
      ctaLabel:
        type: text
        label: Texte du bouton
      ctaHref:
        type: text
        label: Lien du bouton
        comment: >-
          URL finale, préfixe de langue inclus (ex. /fr/decouvrir) — les
          sections sont rendues telles quelles, sans ajout du préfixe.
      sectionTitle:
        type: text
        label: Titre de section
      titleAccent:
        type: text
        label: Mot accentué du titre
        comment: >-
          Sous-chaîne du titre affichée en bleu (ex. « vraiment »). Vide =
          titre uniforme.
      intro:
        type: textarea
        label: Paragraphe d'appui
      learnMore:
        type: text
        label: Libellé du bouton des cartes
      readMoreLabel:
        type: text
        label: Libellé « Lire la suite »
        comment: Lien au bas de chaque carte d'article. Vide = absent.
      body:
        type: textarea
        label: Texte
      # Cartes d'expertise (tableau `items` de la section « Expertises »).
      # NB : la section « Solutions phares » porte AUSSI un tableau `items` —
      # sa spec bookshop (home-solutions.bookshop.yml) le re-lie à
      # _structures.solution_items au niveau structure, qui PRIME sur ce repli
      # de collection (même mécanique que le `variant` form vs cta).
      items:
        type: array
        label: Cartes d'expertise
        options:
          structures: _structures.expertise_items
      # Tuiles de caractéristiques (section « Solution » — home-solution).
      features:
        type: array
        label: Tuiles de caractéristiques
        options:
          structures: _structures.solution_features
      number:
        type: text
        label: Numéro (hérité — plus affiché)
        comment: "Champ de l'ancien design, conservé pour compatibilité."
      accent:
        # P-16 : borné à la charte (même select qu'au niveau structure
        # expertise_items, qui prime — dupliqué ici pour qu'aucun chemin
        # d'édition n'offre de texte libre).
        type: select
        label: Couleur d'accent (héritée — plus affichée)
        options:
          allow_empty: false
          values:
            - '#1a5bff'
            - '#0d1430'
            - '#1a1f28'
            - '#faf7f3'
            - '#f2ece4'
            - '#e9e1d6'
        # Quoted: an unquoted # would start a YAML comment mid-value.
        comment: "Les 6 ancres de la charte (#1a5bff Bleu Victrix, #0d1430 Bleu nuit, #1a1f28 Anthracite, #faf7f3 Ivoire, #f2ece4 Beige, #e9e1d6 Sable). Champ de l'ancien design, conservé pour compatibilité ; plus rendu."
      description:
        type: textarea
        label: Description
      href:
        type: text
        label: Lien
      names:
        type: array
        label: Noms des partenaires
      # Même correctif que blog.tags[*] : type d'entrée requis pour qu'un
      # tableau vide offre « + Ajouter » au lieu de « misconfigured ».
      names[*]:
        type: text
        label: Nom du partenaire
      image:
        type: image
        label: Image
        options:
          paths:
            # Images live beside the locale folders (src/content/home); the
            # SAVED value must stay relative to the JSON file ("../<fichier>")
            # for Astro's image() resolver — hence uploads_use_relative_path.
            uploads: /src/content/home
            uploads_use_relative_path: true

  landing:
    path: src/content/landing
    name: Campagnes
    singular_name: Campagne
    description: >-
      Pages d'atterrissage de campagne, bâties par sections (héros, cartes à icônes,
      appel à l'action, formulaire). Les dossiers fr/ et en/ contiennent les
      deux langues ; le même nom de fichier relie une traduction à l'autre.
    icon: campaign
    # First value = default editor (doc reference in the blog collection's
    # comment). Campaign pages are section-built → Visual Editor first (live
    # Bookshop rendering is the whole point of the spike); Content Editor
    # second for quick front-matter/SEO edits without the preview.
    _enabled_editors:
      - visual
      - content
    # Same [relative_base_path] trick as blog: the locale folder becomes the
    # URL prefix. Landing has no per-locale `slug` frontmatter (yet) — the
    # filename IS the URL slug in both locales, so this template is exact.
    url: /[relative_base_path]/campagnes/[slug]/
    # "+ Ajouter" templates — same rationale as blog: force the fr/ or en/
    # folder (a root-level file would collide into /fr/ in the campagnes
    # getStaticPaths) and start from front matter that SATISFIES the frozen
    # landing contract (title + sections required — an empty file would break
    # the build of the commit CloudCannon pushes). Translation pairing
    # workflow: create (or Duplicate) the same filename in the other folder.
    schemas:
      default:
        name: Campagne (FR)
        icon: campaign
        path: schemas/landing-fr.md
        create:
          path: 'fr/{title|slugify}.md'
      en:
        name: Campaign (EN)
        icon: campaign
        path: schemas/landing-en.md
        create:
          path: 'en/{title|slugify}.md'
    # Collection card shown in the CloudCannon file browser.
    preview:
      icon: campaign
      text:
        - key: title
        - text: Campagne sans titre
      subtext:
        - key: description
    # Inputs are keyed by FIELD NAME and cascade into nested objects/arrays of
    # this collection — a name shared across levels (title, description) gets
    # ONE config, so those labels/comments stay generic on purpose.
    _inputs:
      title:
        type: text
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO), d'une section ou d'une carte,
          selon le contexte.
      description:
        type: textarea
        label: Description
        comment: >-
          Au niveau de la page : description pour les moteurs de recherche et
          les partages. Dans une « Carte à icône » : le texte de la carte.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          Activé par défaut : les pages de campagne (trafic payant) restent
          hors des résultats de recherche. Désactiver seulement si la page
          doit être indexée.
      # ---- P-04 : en-tête / pied de page de campagne. Le bloc `header` est
      # optionnel — sans lui (ou en mode « complet »), la page garde l'en-tête
      # normal du site. Le CTA du bloc réutilise les noms ctaLabel/ctaHref des
      # sections (cascade : mêmes _inputs « Libellé/Lien du bouton »). ----
      header:
        type: object
        label: En-tête de la page
        comment: >-
          Optionnel — mode « complet » (défaut) : l'en-tête normal du site.
          « allege » : logo + un seul bouton (campagne payante). «
          personnalise » : liens et interrupteurs ci-dessous.
      mode:
        type: select
        label: Mode d'en-tête
        comment: >-
          complet = en-tête normal du site · allege = logo + bouton seulement
          · personnalise = liens bornés + interrupteurs. Bouton : ctaLabel /
          ctaHref vides = bouton « Portail client » du site.
        options:
          values:
            - complet
            - allege
            - personnalise
      links:
        type: array
        label: Liens (mode personnalisé)
        comment: >-
          Au plus 5 liens simples (pas de méga-menus) — URL finale, préfixe
          de langue inclus (ex. « /fr/contact »).
        options:
          structures: _structures.header_links
      showAnnounce:
        type: switch
        label: Afficher la bannière d'annonce
        comment: Mode personnalisé seulement (ignoré en mode allégé).
      showLangSwitch:
        type: switch
        label: Afficher le sélecteur FR/EN
        comment: Mode personnalisé seulement (ignoré en mode allégé).
      showSearch:
        type: switch
        label: Afficher l'icône de recherche
        comment: >-
          Mode personnalisé seulement — la recherche est absente par défaut
          hors du mode complet (amendement P-06/P-04).
      footerMode:
        type: select
        label: Pied de page
        comment: >-
          complet (défaut) = pied de page normal du site · allege = logo +
          barre légale seulement (campagne payante).
        options:
          values:
            - complet
            - allege
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder
          le héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` is the section discriminator (set by the palette) — never
      # hand-edited, so it cascades to hidden for every input named `type` in
      # this collection. The INNER `type` of a form field is re-exposed at a
      # MORE SPECIFIC cascade level: _structures.form_fields.values[0]._inputs
      # below (the containing structure outranks collection-level _inputs).
      # CloudCannon has NO bracketed path-key syntax ("fields[*].type" was
      # inert config) — plain input names only.
      type:
        hidden: true
      eyebrow:
        type: text
        label: Surtitre
        comment: Petit libellé affiché au-dessus du titre du héros (optionnel).
      subtitle:
        type: textarea
        label: Sous-titre
      intro:
        type: textarea
        label: Introduction
        comment: Court paragraphe sous le titre de la section (optionnel).
      body:
        type: textarea
        label: Texte
      ctaLabel:
        type: text
        label: Libellé du bouton
      ctaHref:
        type: text
        label: Lien du bouton
        comment: >-
          URL finale, préfixe de langue inclus (ex. « /fr/contact ») — les
          sections sont rendues telles quelles, sans ajout du préfixe.
      variant:
        type: select
        label: Variante
        comment: « light » = bande pâle ; « dark » = bande marine foncée.
        options:
          values:
            - light
            - dark
      items:
        type: array
        label: Cartes
        options:
          structures: _structures.benefit_items
      fields:
        type: array
        label: Champs du formulaire
        comment: >-
          Envoi réel via le backend du site quand la construction se fait avec
          PUBLIC_FORMS_ENABLED=1 (sinon maquette, bouton désactivé) — voir
          docs/formulaires.md. Astuce : « Formulaire lié » remplace ces champs
          par un formulaire réutilisable de la collection Formulaires.
        options:
          structures: _structures.form_fields
      submitLabel:
        type: text
        label: Libellé du bouton d'envoi
      consentText:
        type: textarea
        label: Texte de consentement
        comment: >-
          Mention affichée sous les champs (ex. consentement Loi 25 sur la
          protection des renseignements personnels).
      label:
        type: text
        label: Libellé du champ
      required:
        type: switch
        label: Champ obligatoire
      # FAQ section fields (cascade — only the FAQ items use these names).
      question:
        type: text
        label: Question
      answer:
        type: textarea
        label: Réponse
        comment: >-
          Texte simple, sans HTML — la réponse est aussi publiée en données
          structurées FAQPage (JSON-LD) pour les moteurs de recherche.

  # Services (P-07) — pages composables PUBLIQUES et indexables, même palette de
  # sections que les campagnes (src/content/services). Patron de la collection
  # landing, MAIS : éditeur data (JSON, pas de corps markdown), noindex par
  # défaut à FALSE (inverse des campagnes), et création par gabarit PAR LANGUE
  # (schemas/service-{fr,en}.json, comme la collection forms). Les CHAMPS des
  # sections viennent des specs .bookshop.yml (générés dans _structures.sections,
  # qui priment sur les _inputs de collection) — d'où des _inputs de collection
  # volontairement minimaux (page + sections).
  services:
    path: src/content/services
    name: Services
    singular_name: Service
    description: >-
      Pages de services, bâties par sections (comme les campagnes) mais
      PUBLIQUES et indexables. Les dossiers fr/ et en/ contiennent les deux
      langues ; le même nom de fichier relie une traduction à l'autre.
    icon: rocket_launch
    # Éditeur visuel par défaut (première valeur — voir le commentaire de la
    # collection blog) : les services sont bâtis par sections, comme les
    # campagnes ; Data en second pour les éditions de front matter / SEO. Pas de
    # corps markdown (fichiers JSON) → pas de `content`.
    _enabled_editors:
      - visual
      - data
    # fr/<slug>.json → /fr/services/<slug>/ ; le segment de langue devient le
    # préfixe d'URL (même astuce [relative_base_path] que blog/landing).
    # ⚠️ LIMITE CONNUE (branchement 2026-07-29) : pour les services IMBRIQUÉS
    # (fr/cybersecurite/zero-trust.json) et les fichiers EN à slug anglais
    # surchargé, ce gabarit donne un lien d'aperçu inexact ([relative_base_path]
    # inclut le sous-dossier et [slug] ignore le champ `slug`). L'URL réelle est
    # /<langue>/services/<slug ou chemin>/ — suivi : gabarit d'URL par données
    # quand CloudCannon le permettra.
    url: /[relative_base_path]/services/[slug]/
    preview:
      icon: rocket_launch
      text:
        - key: title
        - text: Service sans titre
      subtext:
        - key: description
    # « + Ajouter » : un gabarit par langue pour que le fichier atterrisse dans
    # fr/ ou en/ avec un JSON valide (patron de la collection forms). Flux de
    # traduction : créer (ou Dupliquer) le même nom de fichier dans l'autre dossier.
    schemas:
      default:
        name: Service (FR)
        icon: rocket_launch
        path: schemas/service-fr.json
        create:
          path: 'fr/{title|slugify}.json'
      en:
        name: Service (EN)
        icon: rocket_launch
        path: schemas/service-en.json
        create:
          path: 'en/{title|slugify}.json'
    _inputs:
      title:
        type: text
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO). Selon le contexte, sert aussi de
          libellé à certaines sections ou cartes.
      description:
        type: textarea
        label: Description
        comment: >-
          Description pour les moteurs de recherche et les partages.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          DÉSACTIVÉ par défaut : un service est une page publique, indexée
          (l'inverse des campagnes). N'activer que pour retirer temporairement
          un service des résultats de recherche.
      seoTitle:
        type: text
        label: Titre SEO (surcharge)
        comment: >-
          Remplace le titre dans l'onglet du navigateur et les résultats
          Google. Vide = le titre de la page.
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder le
          héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      # `type` = discriminant de section (défini par la palette) — jamais édité.
      type:
        hidden: true

  # Pages génériques (2026-08-11) — pages composables de PREMIER NIVEAU d'URL
  # (/decouvrir, /expertises, /produits, /secteurs, /tarification,
  # /centre-de-confiance, pages légales…), rendues par la route attrape-tout
  # src/pages/[lang]/[...slug].astro. PATRON EXACT de la collection services
  # (mêmes sections, mêmes gabarits par langue), sans le préfixe /services/.
  # Créées comme PLACEHOLDERS (noindex activé) : remplacer le contenu puis
  # désactiver « Masquer des moteurs de recherche » quand la page est prête.
  pages:
    path: src/content/pages
    name: Pages
    singular_name: Page
    description: >-
      Pages générales du site (Découvrir, Expertises, Produits, Secteurs,
      Tarification, Centre de confiance, pages légales…), bâties par sections.
      Les dossiers fr/ et en/ contiennent les deux langues ; le même nom de
      fichier relie une traduction à l'autre. Une page placeholder reste
      masquée des moteurs tant que « Masquer des moteurs de recherche » est
      activé.
    icon: description
    _enabled_editors:
      - visual
      - data
    # fr/<slug>.json → /fr/<slug>/ (pas de préfixe — pages de premier niveau).
    url: /[relative_base_path]/[slug]/
    preview:
      icon: description
      text:
        - key: title
        - text: Page sans titre
      subtext:
        - key: description
    schemas:
      default:
        name: Page (FR)
        icon: description
        path: schemas/page-fr.json
        create:
          path: 'fr/{title|slugify}.json'
      en:
        name: Page (EN)
        icon: description
        path: schemas/page-en.json
        create:
          path: 'en/{title|slugify}.json'
    _inputs:
      title:
        type: text
        label: Titre
        comment: >-
          Titre de la page (onglet + SEO). Selon le contexte, sert aussi de
          libellé à certaines sections.
      description:
        type: textarea
        label: Description
        comment: >-
          Description pour les moteurs de recherche et les partages.
      noindex:
        type: switch
        label: Masquer des moteurs de recherche
        comment: >-
          ACTIVÉ par défaut sur une nouvelle page (placeholder). Le désactiver
          quand la page a son vrai contenu — elle entre alors aussi au sitemap
          automatiquement.
      seoTitle:
        type: text
        label: Titre SEO (surcharge)
        comment: >-
          Remplace le titre dans l'onglet du navigateur et les résultats
          Google. Vide = le titre de la page.
      sections:
        type: array
        label: Sections
        comment: >-
          La page est construite uniquement à partir de ces sections. Garder le
          héros en PREMIÈRE position : il porte le seul <h1> de la page.
        options:
          structures: _structures.sections
      type:
        hidden: true

  # Catalogue de solutions (/fr|en/solutions) — fiches JSON à plat, une carte
  # du catalogue par fiche (suite n°1 du plan
  # docs/design/solutions-catalogue-plan.md §3). Éditeur de données : la fiche
  # n'a PAS de page propre (le catalogue est une page unique avec filtres) —
  # les pages de détail /solutions/<slug> restent une suite planifiée.
  solutions:
    path: src/content/solutions
    name: Solutions
    singular_name: Solution
    description: >-
      Fiches du catalogue de solutions (page /solutions). Les dossiers fr/ et
      en/ contiennent les deux langues ; le même nom de fichier relie une
      traduction à l'autre. Chaque fiche est une carte du catalogue.
    icon: apps
    # Pas de page par fiche → pas d'URL d'aperçu (le lien mènerait à un 404).
    disable_url: true
    # Éditeur de données uniquement (JSON structuré, pas de corps markdown).
    _enabled_editors:
      - data
    preview:
      icon: apps
      text:
        - key: title
        - text: Solution sans titre
      subtext:
        - key: description
    # « + Ajouter » : un gabarit par langue pour que le fichier atterrisse dans
    # fr/ ou en/ avec un JSON valide (même logique que services/forms). Flux de
    # traduction : créer (ou Dupliquer) le même nom de fichier dans l'autre
    # dossier.
    schemas:
      default:
        name: Solution (FR)
        icon: apps
        path: schemas/solution-fr.json
        create:
          path: 'fr/{title|slugify}.json'
      en:
        name: Solution (EN)
        icon: apps
        path: schemas/solution-en.json
        create:
          path: 'en/{title|slugify}.json'
    _inputs:
      title:
        type: text
        label: Titre
      description:
        type: textarea
        label: Description
        comment: Texte affiché sur la carte du catalogue.
      image:
        type: image
        label: Image de la vignette
        comment: >-
          Optionnelle — vide, la carte affiche une vignette de remplacement
          grise. Les téléversements atterrissent dans public/images/solutions/
          (adresse servie telle quelle, /images/…).
        options:
          paths:
            static: public
            uploads: public/images/solutions
      sector:
        type: text
        label: Secteur d'activité
        comment: >-
          Chip en haut de la vignette ET valeur du filtre « Secteurs
          d'activité » : reprendre EXACTEMENT la graphie des autres fiches —
          une variante (accent, majuscule) crée un filtre séparé.
      solutionType:
        type: text
        label: Type de solution
        comment: >-
          Chip au pied de la carte ET valeur du filtre « Types de solution » —
          même consigne de graphie exacte que le secteur.
      featured:
        type: switch
        label: Solution vedette
        comment: >-
          Activé : la fiche alimente le grand panneau bleu nuit en tête de
          catalogue. En cas de doublon, la première selon l'ordre d'affichage
          gagne.
      order:
        type: number
        label: Ordre d'affichage
        comment: Croissant — les petits numéros d'abord (la vedette est à 0).
      href:
        type: text
        label: Lien de la carte
        comment: >-
          SANS préfixe de langue (ex. /contact ou
          /services/productivite/o-bureau) — le site ajoute /fr ou /en
          automatiquement (convention navigation, l'INVERSE des sections de
          page). Vide = carte sans lien.
      docHref:
        type: text
        label: Lien « Documentation » (vedette)
        comment: >-
          Panneau vedette seulement. Sans préfixe de langue, comme le lien de
          la carte.

  # Textes du site (2026-08-11) — chaînes d'interface éditables (un JSON par
  # langue dans src/data/site, patron de la collection navigation). Premier
  # locataire : la page 404 (l'ancien texte « prototype » de ui.ts est retiré ;
  # le user veut TOUT le texte éditable). Destiné à absorber d'autres chaînes
  # de chrome au fil des lots (footer = P-13+).
  site:
    path: src/data/site
    name: Textes du site
    singular_name: Textes du site
    description: >-
      Textes qui s'affichent sur TOUTES les pages sans appartenir à aucune :
      pied de page et bandeau de consentement (+ la page « introuvable »). Un
      fichier par langue (fr.json / en.json). Le texte propre à une page
      s'édite avec sa page ; le bandeau promo vit dans « Navigation ».
    icon: translate
    # Deux fichiers fixes (fr/en) — rien à ajouter/supprimer/renommer.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    # Pas de page à prévisualiser (le JSON n'est pas une page).
    disable_url: true
    _enabled_editors:
      - data
    # ⚠️ Les _inputs de collection sont une carte PLATE par nom de champ : les
    # clés génériques (title, label, href, text) sont partagées par les trois
    # blocs — d'où des libellés volontairement génériques, qui se lisent bien
    # partout. Les libellés précis vivent sur les clés de bloc.
    _inputs:
      # --- Pied de page (Footer.astro + pied allégé des campagnes) ----------
      footer:
        type: object
        label: Pied de page
        comment: >-
          Affiché au bas de toutes les pages. Les colonnes de liens, les
          coordonnées, les réseaux sociaux et les mentions légales.
      columns:
        type: array
        label: Colonnes de liens
        comment: Une colonne par thème (Expertises, Services, Produits, À propos).
        options:
          structures: _structures.footer_columns
      # `links` existe sous DEUX formes : les boutons de la 404 (avec
      # « principal ») et les liens d'une colonne de pied de page (sans). La
      # carte plate ne peut en tenir qu'une → elle sert la 404, et
      # _structures.footer_columns re-pointe SES `links` vers site_links à son
      # propre niveau (qui prime — même mécanique que form_fields/faq_items).
      links:
        type: array
        label: Boutons
        comment: Liens proposés au visiteur (le « principal » est bleu).
        options:
          structures: _structures.site_buttons
      contactTitle:
        type: text
        label: Titre de la colonne Contact
      email:
        type: text
        label: Courriel affiché
        comment: Sert aussi de destination du lien (mailto:).
      phone:
        type: text
        label: Téléphone affiché
        comment: Tel qu'il doit apparaître, avec espaces et tirets.
      phoneHref:
        type: text
        label: Téléphone composable
        comment: >-
          Le même numéro SANS espace ni tiret, indicatif pays compris
          (ex. +15148791919) — c'est ce que compose un téléphone mobile.
      socialLabel:
        type: text
        label: Intitulé des réseaux sociaux
      contactCta:
        type: object
        label: Bouton du pied de page
        comment: La pastille bleue (accès au portail client).
      social:
        type: array
        label: Réseaux sociaux
        comment: >-
          Liens texte. « # » = adresse non fournie (le lien ne mène nulle part)
          — remplacer par l'adresse réelle de la page Victrix.
        options:
          structures: _structures.site_links
      legal:
        type: array
        label: Mentions légales (barre du bas)
        options:
          structures: _structures.site_links
      # --- Bandeau de consentement (Loi 25) ---------------------------------
      consent:
        type: object
        label: Bandeau de consentement (Loi 25)
        comment: >-
          Affiché en bas de l'écran au premier passage, jusqu'au choix du
          visiteur. Formulation à portée légale : valider les changements.
      policyLabel:
        type: text
        label: Libellé du lien vers la politique
      policyHref:
        type: text
        label: Lien vers la politique
        comment: SANS préfixe de langue (/politique-confidentialite).
      accept:
        type: text
        label: Bouton « Accepter »
      refuse:
        type: text
        label: Bouton « Refuser »
      # --- Page « introuvable » (erreur 404) --------------------------------
      notFound:
        type: object
        label: Page « introuvable » (erreur 404)
        comment: >-
          Textes affichés quand un visiteur atteint une adresse inexistante.
      metaTitle:
        type: text
        label: Titre d'onglet
      metaDescription:
        type: textarea
        label: Description (moteurs de recherche)
      eyebrow:
        type: text
        label: Surtitre
      title:
        type: text
        label: Titre
      text:
        type: textarea
        label: Texte
      requestedLabel:
        type: text
        label: Étiquette « adresse demandée »
        comment: Affichée devant l'adresse que le visiteur a demandée.
      # --- Clés partagées par les trois blocs (carte plate) -----------------
      label:
        type: text
        label: Libellé
      href:
        type: text
        label: Lien
        comment: >-
          SANS préfixe de langue (/contact, pas /fr/contact) — le site ajoute
          /fr ou /en tout seul.
      primary:
        type: switch
        label: Bouton principal (bleu)

