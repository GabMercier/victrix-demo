          text:
            - key: title
            - text: Carte bento
        value:
          title: ''
          text: ''
          peau: blanche
          taille: petite
          icon: ''
          image: ''
          href: ''
        _inputs:
          text:
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
