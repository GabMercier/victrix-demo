    - cle: givre
      libelle: Givre (gris très pâle)
      couleur: '#f9fafb'
      apercu: /images/cms/fonds/givre.svg
    - cle: perle
      libelle: Perle (gris pâle)
      couleur: '#f3f4f7'
      apercu: /images/cms/fonds/perle.svg
    - cle: brume
      libelle: Brume (gris clair)
      couleur: '#e5e7eb'
      apercu: /images/cms/fonds/brume.svg
    - cle: bleu-pale
      libelle: Bleu pâle
      couleur: '#f2f5fd'
      apercu: /images/cms/fonds/bleu-pale.svg
    - cle: bleu-clair
      libelle: Bleu clair
      couleur: '#dfe7fb'
      apercu: /images/cms/fonds/bleu-clair.svg
    - cle: ivoire
      libelle: Ivoire (chaud)
      couleur: '#fcf9f5'
      apercu: /images/cms/fonds/ivoire.svg
    - cle: beige
      libelle: Beige (gris chaud)
      couleur: '#f6f3ef'
      apercu: /images/cms/fonds/beige.svg
    - cle: sable
