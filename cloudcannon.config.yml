            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Texte
          image:
            type: text
            options:
              empty_type: string
