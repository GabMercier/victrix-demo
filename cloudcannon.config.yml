  # URL redirects — exposes src/data/redirects.json, which the inline
  # 'victrix:redirects' integration in astro.config.mjs turns into
  # dist/_redirects (Cloudflare Pages format) at build time. A COLLECTION on
  # the data folder is the documented way to make a data file editable in the
  # sidebar ("Data folders function as collections by setting their path to a
  # data directory") — `data_config` would NOT work here: its only documented
  # purpose is feeding Select/Multiselect options, it creates no sidebar entry.
  redirects:
    path: src/data
    # Only redirects.json is editable — the glob hides any other data file
    # that later lands in src/data/.
    glob:
      - redirects.json
    name: Redirections
    singular_name: Redirection
    description: >-
      Redirections d'URL (ex. anciennes adresses WordPress vers les nouvelles
      pages). ATTENTION : une entrée invalide — chemin sans « / » initial,
      destination vide, doublon, redirection vers soi-même — fait échouer le
      build. C'est un garde-fou volontaire : l'erreur de build nomme l'entrée
      à corriger, rien de cassé n'atteint le site.
    icon: alt_route
    # Single dev-owned file: no add/delete/rename, and no preview URL (the
    # JSON is not a page).
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    disable_url: true
    # Data Editor only (and it opens by default — first value). The file is a
    # root-level JSON array: supported by the Data Editor, but the array has
    # no field NAME, so no _inputs/_structures can target the array itself —
    # only its item fields below. The Data Editor's "+" clones the shape of
    # existing rows, so the seeded /demo-redirection entry doubles as the row
    # template: never empty the file completely.
    _enabled_editors:
      - data
    _inputs:
      de:
        type: text
        label: Ancienne URL
        comment: >-
          Chemin commençant par « / » (ex. /demo-redirection), sans domaine.
      vers:
        type: text
        label: Nouvelle destination
        comment: >-
          Chemin du site (ex. /fr/) ou URL complète (https://…).
      code:
        type: select
        label: Type de redirection
        comment: >-
          301 = permanente (transfère le référencement) ; 302 = temporaire.
        options:
          # STRING values — settled empirically 2026-07-15: the Data Editor
          # rejects numeric select values outright ("This select input is
          # misconfigured. This input must have a text value."), exactly the
          # risk the round-2 review flagged. The editor therefore saves
          # "code": "301" (string) into redirects.json; the build validator
          # (astro.config.mjs, 'victrix:redirects') accepts the exact strings
          # "301"/"302" and normalizes them to numbers for _redirects output.
          # Anything else (303, free text…) still fails the build loudly —
          # that's the guardrail. The seed entry uses the string form too so
          # the select shows it as selected (a numeric 301 would not match).
          values:
            - "301"
            - "302"

  # Formulaires réutilisables (« forms v2 ») — un JSON par formulaire dans
  # src/data/forms/fr|en/ (même nom de fichier = paire de traduction). Une
  # section « Formulaire » d'une page les référence par leur identifiant (nom
  # du fichier sans .json). LE DESTINATAIRE EST DÉFINI ICI, jamais dans la
  # page : côté serveur, /api/forms résout destinataire/objet/champs depuis un
  # registre embarqué au build (liste blanche) — le navigateur n'envoie qu'un
  # identifiant. Validé au build (collection `forms`, src/content.config.ts).
  forms:
    path: src/data/forms
    name: Formulaires
    singular_name: Formulaire
    description: >-
      Définitions de formulaires réutilisables (destinataire, objet, champs).
      Les dossiers fr/ et en/ contiennent les deux langues ; le même nom de
      fichier relie une traduction à l'autre. Les pages y font référence par
      l'identifiant (nom du fichier sans .json).
    icon: dynamic_form
    # Pas de page à prévisualiser (le JSON n'est pas une page).
    disable_url: true
    # Éditeur de données uniquement (JSON structuré, pas de corps markdown).
    _enabled_editors:
      - data
    # « + Ajouter » : un gabarit par langue pour que le fichier atterrisse dans
    # fr/ ou en/ avec un JSON valide (même logique que blog/landing).
    schemas:
      default:
        name: Formulaire (FR)
        icon: dynamic_form
        path: schemas/form-fr.json
        create:
          path: 'fr/{name|slugify}.json'
      en:
        name: Formulaire (EN)
        icon: dynamic_form
        path: schemas/form-en.json
        create:
          path: 'en/{name|slugify}.json'
    _inputs:
      name:
        type: text
        label: Nom (interne)
        comment: Affiché aux éditeurs seulement — jamais aux visiteurs.
      toEmail:
        type: text
        label: Courriel destinataire
        # P-16 : champ SENSIBLE — voir aussi guide-edition.md §Formulaires.
        comment: >-
          ⚠️ CHAMP SENSIBLE : cette adresse reçoit RÉELLEMENT les soumissions
          de CE formulaire — une faute de frappe détourne les messages des
          visiteurs. Vérifier deux fois avant de publier. Vide = le
          destinataire global du site (variable FORMS_TO_EMAIL).
      subject:
        type: text
        label: Objet du courriel
        comment: Vide = objet générique.
      submitLabel:
        type: text
        label: Libellé du bouton d'envoi
      consentText:
        type: textarea
        label: Texte de consentement
        comment: Mention Loi 25 affichée au-dessus du bouton (optionnelle).
      fields:
        type: array
        label: Champs
        comment: >-
          Le nom technique de chaque champ dérive de son libellé — éviter deux
          libellés identiques dans un même formulaire.
        options:
          structures: _structures.form_fields
      # P-16 : label/required vivent désormais au niveau STRUCTURE
      # (_structures.form_fields), avec tous les autres _inputs de champ.

  # Navigation du site (menu principal, méga-menu, barre d'annonce, bouton
  # portail) — un JSON par langue dans src/data/navigation, consommé par
  # src/components/Header.astro et validé au build par la collection
  # `navigation` (src/content.config.ts) : un lien invalide fait échouer le
  # build en nommant le fichier fautif. ATTENTION CONVENTION : les liens
  # internes sont stockés SANS préfixe de langue (/contact, pas /fr/contact) —
  # le gabarit ajoute /fr ou /en au rendu. C'est l'INVERSE des sections de
  # page (ctaHref = URL finale) ; les commentaires des champs le rappellent.
  navigation:
    path: src/data/navigation
    name: Navigation
    singular_name: Navigation
    description: >-
      Menu principal, méga-menu, barre d'annonce et bouton du portail (un
      fichier par langue). Liens internes SANS préfixe de langue (ex.
      /contact) — le site ajoute /fr ou /en automatiquement.
    icon: menu
    # Two dev-owned files (fr.json / en.json): no add/delete/rename, and no
    # preview URL (the JSON is not a page).
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    disable_url: true
    # Data Editor only (opens by default — first value). These are structured
    # JSON files with no markdown body.
    _enabled_editors:
      - data
    _inputs:
      items:
        type: array
        label: Menu principal
        comment: Entrées du menu d'en-tête, dans l'ordre d'affichage.
        options:
          structures: _structures.nav_links
      portal:
        type: object
        label: Lien « Portail client »
        comment: >-
          Affiché en lien texte quand le bouton d'action ci-dessous est
          renseigné (sinon il redevient le bouton).
      visible:
        type: switch
        label: Visible
      cta:
        type: object
        label: Bouton d'action de l'en-tête
        comment: >-
          Le bouton bleu à droite (ex. « Contact »). Lien sans préfixe de
          langue.
      mega:
        type: object
        label: Méga-menu
        comment: >-
          S'attache aux entrées du menu principal dont le lien correspond au
          « Lien parent » (et aux « Liens parents supplémentaires »).
      parentHref:
        type: text
        label: Lien parent
        comment: >-
          Doit correspondre au lien d'une entrée du menu principal (ex.
          /expertises).
      parentHrefs:
        type: array
        label: Liens parents supplémentaires
        comment: >-
          Autres entrées du menu qui ouvrent le MÊME panneau (ex. /services,
          /produits). Chaque valeur doit correspondre au lien d'une entrée du
          menu principal.
      ariaLabel:
        type: text
        label: Libellé d'accessibilité
      columns:
        type: array
        label: Colonnes
        options:
          structures: _structures.nav_columns
      links:
        type: array
        label: Liens
        options:
          structures: _structures.nav_links
      icon:
        type: select
        label: Icône
        comment: >-
          Champ hérité (plus affiché depuis la refonte 2026-08) — conservé pour
          compatibilité.
        options:
          values:
            - strategy
            - cloud
            - security
            - productivity
            - managed
      # Re-skin chrome 2026-08-04 : carte mise en avant + bandeau bas du
      # méga-menu (Figma « Composants »). Les deux blocs sont optionnels —
      # vides/absents, le panneau affiche ses colonnes seules.
      featured:
        type: object
        label: Carte mise en avant
        comment: >-
          Carte à droite du méga-menu Services (titre, texte, lien). Optionnelle.
      body:
        type: textarea
        label: Texte
      image:
        type: image
        label: Image (optionnelle)
        comment: >-
          Chemin public (ex. /images/nav/carte.jpg). Vide = pas d'image.
        # Sans `paths` explicites, un téléversement tombait sur le repli global
        # (src/assets/uploads) et enregistrait un chemin que Header.astro ne
        # sert pas — corrigé 2026-08-12 : même patron public que les autres
        # images servies telles quelles (static: public → l'adresse commence
        # à /images/…).
        options:
          paths:
            static: public
            uploads: public/images/nav
      stripe:
        type: object
        label: Bandeau bas du méga-menu
        comment: >-
          Bandeau sous les colonnes (texte court + 2 liens max). Optionnel.
      text:
        type: textarea
        label: Texte
      # Méga-menu Ressources : seuls les TEXTES sont éditables — les catégories
      # (étiquettes du blogue) et les derniers articles sont générés au build
      # depuis la collection Blogue (voir Header.astro).
      megaRessources:
        type: object
        label: Méga-menu Ressources
        comment: >-
          Catégories et derniers articles sont automatiques (tirés du blogue) ;
          seuls les textes ci-dessous s'éditent. S'attache à l'entrée du menu
          dont le lien est identique au « Lien parent ».
      intro:
        type: textarea
        label: Texte d'introduction
      ctaLabel:
        type: text
        label: Libellé du bouton
        comment: >-
          Méga-menu Ressources : le bouton mène au centre de ressources (le
          « Lien parent »). Carte mise en avant : le lien du champ « Lien ».
      categoriesTitle:
        type: text
        label: Titre de la colonne Catégories
      latestTitle:
        type: text
        label: Titre de la colonne Derniers articles
      announce:
        type: object
        label: Barre d'annonce
      enabled:
        type: switch
        label: Affichée
        comment: Désactivé = la barre d'annonce disparaît du site.
      # Diffusion planifiée (marketing) : fenêtre [début, fin) évaluée à chaque
      # PUBLICATION/reconstruction du site (rebuild quotidien automatique — voir
      # guide-edition.md « Planifier »). L'éditeur visuel montre toujours la
      # bannière, fenêtre ou pas, pour pouvoir l'éditer.
      startAt:
        type: datetime
        label: Diffuser à partir de
        comment: >-
          Vide = dès maintenant. La bannière apparaît au premier build suivant
          cette date (heure UTC).
      endAt:
        type: datetime
        label: Retirer à partir de
        comment: >-
          Vide = jamais retirée. La bannière disparaît au premier build suivant
          cette date (heure UTC).
      before:
        type: text
        label: Texte (avant la partie en gras)
      strong:
        type: text
        label: Partie en gras
      after:
        type: textarea
        label: Texte (après la partie en gras)
      linkLabel:
        type: text
        label: Libellé du lien
      linkHref:
        type: text
        label: Lien de l'annonce
        comment: Sans préfixe de langue (ex. /produits).
      label:
        type: text
        label: Libellé
      href:
        type: text
        label: Lien
        comment: >-
          Sans préfixe de langue (ex. /contact), ou URL https:// complète.
      service:
        type: text
        label: Service (au lieu du lien)
        comment: >-
          Alternative à « Lien » pour une entrée du menu ou d'une colonne du
          méga-menu : identifiant d'un service = nom du fichier dans
          src/content/services/<langue>/ SANS « .json » (ex.
          intelligence-artificielle). Renseigner SOIT « Lien » SOIT « Service »,
          jamais les deux. Le site calcule l'URL /<langue>/services/<identifiant>
          et VÉRIFIE que le service existe : un identifiant inconnu — ou les deux
          champs remplis — bloque la publication avec un message clair.

_structures:
  # Section palette for the landing `sections` array. The VALUES are NOT
  # written here: the CloudCannon postbuild `npx @bookshop/generate` appends
  # one entry per component tagged `spec.structures: [sections]` in
  # component-library/**/*.bookshop.yml, each carrying `_bookshop_name` as the
  # matching key (generate hard-sets `id_key: _bookshop_name` and APPENDS to
  # any existing values — verified in @bookshop/generate/lib/
  # structure-connector.js — so hand-written values would only duplicate every
  # palette entry under a mismatched id_key). Labels/descriptions/icons and
  # picker polish live in the *.bookshop.yml specs; the seeded .md files carry
  # `_bookshop_name` on each section so existing data matches the generated
  # values. Only the keys below are OURS — generate preserves them.
  sections:
    # Card-picker modal when adding a section (nicer than a plain select).
    style: modal
    # CloudCannon's visual editor adds a `_bookshop_name` key to inserted
    # components; the default remove_extra_inputs: true would strip it (and
    # any future undeclared key) on edit — keep every key intact instead.
    remove_extra_inputs: false

  # Uniform sub-arrays: a single-value structure gives the "add" button the
  # right shape even when the array starts empty. NOT tagged in any Bookshop
  # spec, so generate leaves these untouched.
  #
  # Default values use EMPTY STRINGS ("") instead of blank YAML values: blank
  # parses to null, and null fails the Zod `.optional()` string fields mid-edit.
  # (Renommage d'affichage 2026-08-17 : la palette dit « Carte à icône » —
  # la clé technique benefit_items ne change pas.)
  benefit_items:
    values:
      - label: Carte à icône
        icon: check_circle
        preview:
          icon: check_circle
          text:
            - key: title
            - text: Carte à icône
        value:
          title: ''
          description: ''
          icon: ''
        _inputs:
          icon:
            type: select
            label: Icône (optionnelle)
            options:
              allow_empty: true
              values:
                - dossier
                - personne
                - groupe
                - ampoule
                - croissance
                - losange
                - organisation
                - porteur
                - destinataire
            comment: >-
              Tuile pictogramme au-dessus du titre. Vide = aucune.
              organisation/porteur/destinataire = icônes pleines de la page
              Expertises (approche en 3 angles).

  # Cartes du bento d'expertises (section « Service — Bento d'expertises »,
  # fidélité maquette expertise-mere.css 2026-08-05).
  bento_items:
    values:
      - label: Carte bento
        icon: dashboard
        preview:
          icon: dashboard
          text:
            - key: title
            - text: Carte bento
        value:
          title: ''
          text: ''
          peau: blanche
          taille: petite
          icon: ''
          image: ''
          href: ''
        _inputs:
          text:
            type: textarea
            label: Texte
          peau:
            type: select
            label: Peau de la carte
            options:
              allow_empty: false
              values:
                - blanche
                - bleue
                - ardoise
          taille:
            type: select
            label: Taille dans la grille
            options:
              allow_empty: false
              values:
                - grande
                - haute
                - large
                - petite
            comment: >-
              grande = 2 colonnes × 3 rangées (vitrine avec image) ; haute = 1×2 ;
              large = 2×1 (icône à droite) ; petite = 1×1.
          icon:
            type: select
            label: Icône
            options:
              allow_empty: true
              values:
                - fenetre
                - graphique
                - personnes
                - engrenage
                - document
                - code
          image:
            type: text
            label: Image (chemin public)
            comment: "Cartes « grande » seulement. Ex. /images/services/… — servie telle quelle."
          href:
            type: text
            label: Lien (optionnel)
            comment: Rend la carte entière cliquable. URL finale, préfixe de langue inclus.

  # Cartes outils (section « Service — Solutions exclusives »).
  tool_items:
    values:
      - label: Carte outil
        icon: widgets
        preview:
          icon: widgets
          text:
            - key: title
            - text: Carte outil
        value:
          title: ''
          text: ''
          ctaLabel: ''
          href: ''
          icon: ''
        _inputs:
          text:
            type: textarea
            label: Texte
          ctaLabel:
            type: text
            label: Libellé du lien
          icon:
            type: select
            label: Icône
            options:
              allow_empty: true
              values:
                - calendrier
                - etoile

  # Tuiles statistiques (section « Produit — Valeur stratégique », fidélité
  # maquette produit-enfant.css 2026-08-05). Clé DISTINCTE de stat_items
  # (« Victrix en chiffres », {number,label}) : YAML garde la DERNIÈRE
  # définition d'une clé dupliquée — sous un même nom, celle-ci serait écrasée.
  stat_tiles:
    values:
      - label: Tuile statistique
        icon: monitoring
        preview:
          icon: monitoring
          text:
            - key: value
            - text: Tuile statistique
        value:
          value: ''
          label: ''
        # _inputs de STRUCTURE : `label` est aussi un nom de champ de formulaire
        # au niveau collection — le libellé spécifique DOIT vivre ici (il prime).
        _inputs:
          value:
            type: text
            label: Valeur
            comment: "Chiffre ou mot mis en avant (ex. « ROI », « 100 % »)."
          label:
            type: text
            label: Étiquette
            comment: "Petite ligne en majuscules sous la valeur."

  # Cartes d'offre numérotées (section « Produit — Offres numérotées ») — la
  # liste `bullets` de chaque carte pointe vers _structures.offer_bullets.
  offer_items:
    values:
      - label: Carte d'offre
        icon: format_list_numbered
        preview:
          icon: format_list_numbered
          text:
            - key: title
            - text: Carte d'offre
        value:
          number: ''
          title: ''
          bullets: []
        _inputs:
          number:
            type: text
            label: Numéro
            comment: "Affiché dans la tuile bleue (ex. « 1 »)."
          bullets:
            type: array
            label: Points de la liste
            options:
              structures: _structures.offer_bullets

  # Puces des cartes d'offre (icône + texte).
  offer_bullets:
    values:
      - label: Point de liste
        icon: check_circle
        preview:
          icon: check_circle
          text:
            - key: text
            - text: Point de liste
        value:
          text: ''
          icon: coche
        _inputs:
          text:
            type: text
            label: Texte
          icon:
            type: select
            label: Icône
            options:
              allow_empty: false
              values:
                - coche
                - document
                - cible
                - carte
            comment: "coche = crochet cerclé ; document ; cible ; carte = feuille de route."

  # Cartes de réalisation (section « Produit — Réalisations »).
  realisation_items:
    values:
      - label: Carte de réalisation
        icon: workspace_premium
        preview:
          icon: workspace_premium
          text:
            - key: title
            - text: Carte de réalisation
        value:
          title: ''
          text: ''
          icon: ''
        _inputs:
          text:
            type: textarea
            label: Texte
          icon:
            type: select
            label: Icône
            options:
              allow_empty: true
              values:
                - trousse
                - casque
                - groupe
                - marteau
            comment: "trousse = santé ; casque = services ; groupe = RH ; marteau = juridique. Vide = aucune."

  # Cartes d'expertise ({number,title,accent,description,href}) pour la section
  # « Accueil — Expertises ». Même logique que benefit_items : une structure à
  # valeur unique donne au bouton « + » la bonne forme, même sur un tableau
  # vide. Non taguée dans un spec Bookshop → generate n'y touche pas.
  expertise_items:
    values:
      - label: Carte d'expertise
        icon: category
        preview:
          icon: category
          text:
            - key: title
            - text: Carte d'expertise
        value:
          number: ''
          title: ''
          accent: '#1a5bff'
          description: ''
          href: ''
          image: ''
          variant: claire
          linkLabel: ''
          wide: false
        # _inputs de STRUCTURE (priment sur ceux de la collection — même
        # mécanique que form_fields) : la peau de la carte est une clé fermée.
        _inputs:
          variant:
            type: select
            label: Peau de la carte
            options:
              allow_empty: false
              values:
                - claire
                - image
                - bleue
                - nuit
            comment: >-
              claire = carte blanche bordée ; image = photo + voile navy (renseigner
              « Image ») ; bleue = aplat bleu ; nuit = aplat marine.
          linkLabel:
            type: text
            label: Libellé du lien (surcharge)
            comment: Vide = libellé commun de la section (« Libellé du bouton des cartes »).
          # Référence bento 2026-08-11 : carte large. (Le pictogramme `icon`
          # est RETIRÉ du contrat le 2026-08-17 — correction user : aucun
          # pictogramme dans les tuiles « Nos services ».)
          wide:
            type: switch
            label: Carte large (2 colonnes)
            comment: >-
              Activée, la carte occupe 2 colonnes sur 3 (ex. Cybersécurité en
              tête de grille). Une seule carte large par rangée.
          # P-16 : la couleur d'accent est BORNÉE à la charte (plus de texte
          # libre). Champ hérité — plus affiché depuis la refonte 2026-08 —
          # mais tant qu'il vit au contrat, il ne doit accepter que la charte.
          accent:
            type: select
            label: Couleur d'accent (héritée — plus affichée)
            options:
              allow_empty: false
              values:
                - '#1a5bff'
                - '#0d1430'
                - '#1a1f28'
                - '#faf7f3'
                - '#f2ece4'
                - '#e9e1d6'
            comment: >-
              Les 6 ancres de la charte — #1a5bff Bleu Victrix, #0d1430 Bleu nuit,
              #1a1f28 Anthracite, #faf7f3 Ivoire, #f2ece4 Beige, #e9e1d6 Sable.
              Champ de l'ancien design, conservé pour compatibilité ; plus rendu.

  # Cartes de la section « Solutions phares » (home-solutions, fidélité
  # maquette accueil.css) — images = CHEMINS PUBLICS (ex. /images/home/…),
  # contrairement à l'image de home-solution (relative, résolue par Astro).
  solution_items:
    values:
      - label: Carte de solution
        icon: dark_mode
        preview:
          icon: dark_mode
          text:
            - key: title
            - text: Carte de solution
        value:
          title: ''
          text: ''
          image: ''
          href: ''
          ctaLabel: ''
          icon: ''
        _inputs:
          text:
            type: textarea
            label: Texte
          image:
            type: text
            label: Image (chemin public)
            comment: "Ex. /images/home/sevoc.png — servie telle quelle."
          ctaLabel:
            type: text
            label: Libellé du lien
          icon:
            type: select
            label: Icône
            options:
              allow_empty: true
              values:
                - ecran
                - bouclier
                - nuage
            comment: Icône décorative à gauche du titre (vide = aucune).

  # Tuiles de caractéristiques de la section « Solution » (home-solution).
  solution_features:
    values:
      - label: Tuile de caractéristique
        icon: check_box
        preview:
          icon: check_box
          text:
            - key: label
            - text: Tuile
        value:
          label: ''
          text: ''
        _inputs:
          label:
            type: text
            label: Libellé (majuscules)
          text:
            type: textarea
            label: Texte d'appui

  form_fields:
    values:
      - label: Champ de formulaire
        icon: edit_note
        preview:
          icon: edit_note
          text:
            - key: label
            - text: Champ de formulaire
        # Forme COMPLÈTE (P-05) : les clés étendues sont présentes avec des
        # « formes vides » — options: [], value: '', showIf {field:'',…} —
        # jamais null (un null casserait les .optional() zod en cours
        # d'édition, voir l'entête _structures). Une clé laissée vide signifie
        # simplement « sans objet pour ce type de champ ».
        value:
          label: ''
          type: text
          required: true
          width: plein
          options: []
          value: ''
          showIf:
            field: ''
            equals: ''
        # Structure values support their own _inputs, and the "containing
        # structure" level outranks the landing collection's _inputs in the
        # configuration cascade — this re-exposes the form-field `type` select
        # that the collection-level `type: hidden` (section discriminator)
        # would otherwise hide. Les _inputs des clés étendues (options/value/
        # showIf/field/equals) vivent AUSSI ici pour rester scopés aux champs
        # de formulaire.
        _inputs:
          # P-16 : label/required déplacés ici depuis les _inputs de la
          # collection forms — tous les _inputs de champ vivent au même niveau.
          label:
            type: text
            label: Libellé du champ
          required:
            type: switch
            label: Champ obligatoire
          type:
            type: select
            label: Type de champ
            comment: >-
              text = texte court · email = courriel · tel = téléphone ·
              textarea = texte long · select = liste déroulante · checkbox =
              case à cocher (ex. consentement Loi 25) · hidden = champ caché.
              Les clés « Options », « Valeur (champ caché) » et « Condition
              d'affichage » ne s'appliquent qu'aux types indiqués dans leur
              description.
            options:
              values:
                - text
                - email
                - tel
                - textarea
                - select
                - checkbox
                - hidden
          width:
            type: select
            label: Largeur du champ
            comment: >-
              plein = pleine largeur (défaut) · demi = demi-rangée — deux
              champs « demi » consécutifs se placent côte à côte (ex. Prénom /
              Nom). Présentation seulement.
            options:
              values:
                - plein
                - demi
          options:
            type: array
            label: Options (liste déroulante)
            comment: >-
              Type « select » seulement — au moins une option; éviter les
              virgules dans le texte d'une option. Ignoré pour les autres
              types.
          # Type d'entrée du tableau (notation documentée `nom[*]`) : sans
          # lui, un tableau VIDE est « misconfigured » — CloudCannon ne sait
          # pas quoi créer au « + Ajouter » (le clonage exige une entrée
          # existante). Chaque option est une simple chaîne.
          options[*]:
            type: text
            label: Option
          value:
            type: text
            label: Valeur (champ caché)
            comment: >-
              Type « hidden » seulement. Jetons remplacés à la publication :
              {{page.titre}}, {{page.chemin}}, {{page.slug}}, {{page.langue}}.
              Un jeton {{url.utm_source}} (ou tout autre {{url.…}}, seul dans
              la valeur) est rempli dans le navigateur du visiteur depuis
              l'adresse de la page.
          showIf:
            type: object
            label: Condition d'affichage
            comment: >-
              Laisser vide = champ toujours affiché. Sinon, le champ ne
              s'affiche que si le champ pilote a la valeur attendue (le
              serveur n'exige alors ce champ que lorsque la condition est
              remplie).
          field:
            type: text
            label: Champ pilote (libellé exact)
            comment: >-
              Recopier EXACTEMENT le libellé d'une liste déroulante ou d'une
              case à cocher du même formulaire. Une faute de frappe bloque la
              publication avec un message clair.
          equals:
            type: text
            label: Valeur attendue
            comment: >-
              Une option de la liste pilote, ou « oui » pour une case à
              cocher.

  # Partenaires ({name, logo, description}) pour la section « Bandeau logos
