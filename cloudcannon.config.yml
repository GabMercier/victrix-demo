      couleur: '#dfe7fb'
      apercu: /images/cms/fonds/bleu-clair.svg
    - cle: ivoire
      libelle: Ivoire (chaud)
      couleur: '#fcf9f5'
      apercu: /images/cms/fonds/ivoire.svg
    - cle: beige
      libelle: Beige (gris chaud)
