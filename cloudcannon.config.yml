          ctaLabel:
            type: text
            options:
              empty_type: string
            label: Libellé du lien
          icon:
            type: select
            label: Icône
            options:
              empty_type: string
              allow_empty: true
              values: _select_data.icones
              value_key: cle
              preview:
                text:
                  - key: libelle
                image:
                  - key: apercu
            comment: Icône décorative à gauche du titre (vide = aucune).

  # Tuiles de caractéristiques de la section « Solution » (home-solution).
  solution_features:
    values:
      - label: Tuile de caractéristique
        icon: check_box
        preview:
          icon: check_box
          text:
            - key: label
            - text: Tuile
        value:
          label: ''
          text: ''
        _inputs:
          label:
            type: text
            options:
              empty_type: string
            label: Libellé (majuscules)
          text:
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Texte d'appui

  form_fields:
    values:
      - label: Champ de formulaire
        icon: edit_note
        preview:
          icon: edit_note
          text:
            - key: label
            - text: Champ de formulaire
        # Forme COMPLÈTE (P-05) : les clés étendues sont présentes avec des
        # « formes vides » — options: [], value: '', showIf {field:'',…} —
        # jamais null (un null casserait les .optional() zod en cours
        # d'édition, voir l'entête _structures). Une clé laissée vide signifie
        # simplement « sans objet pour ce type de champ ».
        value:
          label: ''
          type: text
          required: true
          width: plein
          options: []
          value: ''
          showIf:
            field: ''
            equals: ''
        # Structure values support their own _inputs, and the "containing
        # structure" level outranks the landing collection's _inputs in the
        # configuration cascade — this re-exposes the form-field `type` select
        # that the collection-level `type: hidden` (section discriminator)
        # would otherwise hide. Les _inputs des clés étendues (options/value/
        # showIf/field/equals) vivent AUSSI ici pour rester scopés aux champs
        # de formulaire.
        _inputs:
          # P-16 : label/required déplacés ici depuis les _inputs de la
          # collection forms — tous les _inputs de champ vivent au même niveau.
          label:
            type: text
            options:
              empty_type: string
            label: Libellé du champ
          required:
            type: switch
            label: Champ obligatoire
          type:
            type: select
            label: Type de champ
            comment: >-
              text = texte court · email = courriel · tel = téléphone ·
              textarea = texte long · select = liste déroulante · checkbox =
              case à cocher (ex. consentement Loi 25) · hidden = champ caché.
              Les clés « Options », « Valeur (champ caché) » et « Condition
              d'affichage » ne s'appliquent qu'aux types indiqués dans leur
              description.
            options:
              empty_type: string
              values:
                - text
                - email
                - tel
                - textarea
                - select
                - checkbox
                - hidden
          width:
            type: select
            label: Largeur du champ
            comment: >-
              plein = pleine largeur (défaut) · demi = demi-rangée — deux
              champs « demi » consécutifs se placent côte à côte (ex. Prénom /
              Nom). Présentation seulement.
            options:
              empty_type: string
              values:
                - plein
                - demi
          options:
            type: array
            label: Options (liste déroulante)
            comment: >-
              Type « select » seulement — au moins une option; éviter les
              virgules dans le texte d'une option. Ignoré pour les autres
              types.
          # Type d'entrée du tableau (notation documentée `nom[*]`) : sans
          # lui, un tableau VIDE est « misconfigured » — CloudCannon ne sait
          # pas quoi créer au « + Ajouter » (le clonage exige une entrée
          # existante). Chaque option est une simple chaîne.
          options[*]:
            type: text
            options:
              empty_type: string
            label: Option
          value:
            type: text
            options:
              empty_type: string
            label: Valeur (champ caché)
            comment: >-
              Type « hidden » seulement. Jetons remplacés à la publication :
              {{page.titre}}, {{page.chemin}}, {{page.slug}}, {{page.langue}}.
              Un jeton {{url.utm_source}} (ou tout autre {{url.…}}, seul dans
              la valeur) est rempli dans le navigateur du visiteur depuis
              l'adresse de la page.
          showIf:
            type: object
            label: Condition d'affichage
            comment: >-
              Laisser vide = champ toujours affiché. Sinon, le champ ne
              s'affiche que si le champ pilote a la valeur attendue (le
              serveur n'exige alors ce champ que lorsque la condition est
              remplie).
          field:
            type: text
            options:
              empty_type: string
            label: Champ pilote (libellé exact)
            comment: >-
              Recopier EXACTEMENT le libellé d'une liste déroulante ou d'une
              case à cocher du même formulaire. Une faute de frappe bloque la
              publication avec un message clair.
          equals:
            type: text
            options:
              empty_type: string
            label: Valeur attendue
            comment: >-
              Une option de la liste pilote, ou « oui » pour une case à
              cocher.

  # Partenaires ({name, logo, description}) pour la section « Bandeau logos
  # partenaires » (logo-banner). Même GOTCHA que faq_items : le tableau
  # s'appelle AUSSI `items`, le spec logo-banner.bookshop.yml re-pointe son
  # `items` vers CETTE structure.
  logo_items:
    values:
      - label: Partenaire
        icon: workspaces
        preview:
          icon: workspaces
          text:
            - key: name
            - text: Partenaire
        value:
          name: ''
          logo: ''
          description: ''

  # Chiffres ({number, label}) pour la section « Victrix en chiffres » (stats).
  # Même GOTCHA `items` que ci-dessus — re-pointé par stats.bookshop.yml.
  stat_items:
    values:
      - label: Chiffre
        icon: insights
        preview:
          icon: insights
          text:
            - key: number
            - text: Chiffre
        value:
          number: ''
          label: ''
          icon: ''
        _inputs:
          icon:
            type: select
            label: Pictogramme (style « carte » seulement)
            options:
              empty_type: string
              allow_empty: true
              values: _select_data.icones
              value_key: cle
              preview:
                text:
                  - key: libelle
                image:
                  - key: apercu
            comment: >-
              Affiché au-dessus du chiffre quand la section est en style
              « carte ». Toute la banque de pictogrammes du site. Vide = aucun.

  # Navigation (collection « navigation ») : formes des tableaux du menu.
  # Même logique que benefit_items — une structure à valeur unique donne au
  # bouton « + » la bonne forme, même sur un tableau vide. Non taguées dans un
  # spec Bookshop → generate n'y touche pas.
# Liens de l'en-tête de campagne en mode « personnalisé » (P-04). Structure
  # dédiée avec ses PROPRES _inputs : au niveau collection, `label` est déjà
  # « Libellé du champ » (formulaires) — le niveau structure prime (même
  # mécanisme que form_fields).
  header_links:
    values:
      - label: Lien d'en-tête
        icon: link
        preview:
          icon: link
          text:
            - key: label
            - text: Lien d'en-tête
        value:
          label: ''
          href: ''
        _inputs:
          label:
            type: text
            options:
              empty_type: string
            label: Libellé du lien
          href:
            type: text
            options:
              empty_type: string
            label: Lien
            comment: >-
              URL finale, préfixe de langue inclus (ex. « /fr/contact »).

  nav_links:
    values:
      - label: Lien de navigation
        icon: link
        preview:
          icon: link
          text:
            - key: label
            - text: Lien de navigation
        value:
          label: ''
          # Un lien porte SOIT href SOIT service (P-07, méga-menu dynamique E.3) —
          # voir l'aide du champ « Service » (_inputs.service). Cette structure
          # sert AUSSI les liens des colonnes du méga-menu (_inputs.links).
          href: ''
          service: ''

  # ---------------------------------------------------------------------------
  # Collection « Textes du site » (2026-08-11) — pied de page et 404.
  # ---------------------------------------------------------------------------

  # Lien simple {label, href} : liens d'une colonne de pied de page, réseaux
  # sociaux, mentions légales. Href SANS préfixe de langue (sauf réseaux
  # sociaux : URL externe complète, ou « # » tant qu'elle n'est pas fournie).
  site_links:
    values:
      - label: Lien
        icon: link
        preview:
          icon: link
          text:
            - key: label
            - text: Lien
        value:
          label: ''
          href: ''

  # Bouton de la page « introuvable » {label, href, primary} — même forme que
  # site_links + la bascule « bouton principal ».
  site_buttons:
    values:
      - label: Bouton
        icon: smart_button
        preview:
          icon: smart_button
          text:
            - key: label
            - text: Bouton
        value:
          label: ''
          href: ''
          primary: false

  # Colonne de liens du pied de page. Son `_inputs.links` de STRUCTURE prime
  # sur celui de la collection (qui sert les boutons de la 404) — mécanique
  # documentée plus haut pour form_fields et faq_items.
  footer_columns:
    values:
      - label: Colonne du pied de page
        icon: view_column
        preview:
          icon: view_column
          text:
            - key: title
            - text: Colonne du pied de page
        value:
          title: ''
          links: []
        _inputs:
          title:
            type: text
            options:
              empty_type: string
            label: Titre de la colonne
          links:
            type: array
            label: Liens de la colonne
            options:
              structures: _structures.site_links

  nav_columns:
    values:
      - label: Colonne du méga-menu
        icon: view_column
        preview:
          icon: view_column
          text:
            - key: title
            - text: Colonne du méga-menu
        value:
          title: ''
          href: ''
          icon: strategy
          links: []

  # FAQ items ({question, answer} pairs) for the « FAQ » Bookshop section.
  # GOTCHA: the FAQ array is ALSO named `items` (frozen contract), and the
  # collection-level `_inputs.items` above binds every `items` array to
  # _structures.benefit_items — the WRONG shape here. faq.bookshop.yml must
  # therefore re-point its own `items` at THIS structure via a spec-level
  # `_inputs.items` (type: array + options.structures: _structures.faq_items):
  # generate copies spec _inputs onto the palette entry, and that "containing
  # structure" level outranks the collection's — the exact mechanism already
  # used by form_fields to re-expose the field `type` select.
  faq_items:
    values:
      - label: Question / réponse
        icon: quiz
        preview:
          icon: quiz
          text:
            - key: question
            - text: Question / réponse
        value:
          question: ''
          answer: ''

  # Cartes numérotées ({number, title, text, ctaLabel?, ctaHref?}) pour la
  # section « numbered-cards » (P-07). Re-pointée par numbered-cards.bookshop.yml
  # (même GOTCHA `items` que faq/logo/stats). Defaults en chaînes vides.
  numbered_card_items:
    values:
      - label: Carte numérotée
        icon: filter_1
        preview:
          icon: filter_1
          text:
            - key: title
            - text: Carte numérotée
        value:
          number: ''
          title: ''
          text: ''
          ctaLabel: ''
          ctaHref: ''
        _inputs:
          number:
            type: text
            options:
              empty_type: string
            label: Numéro
            comment: "Ex. « 01 » — affiché en gros chiffre pâle."
          title:
            type: text
            options:
              empty_type: string
            label: Titre de la carte
          text:
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Texte de la carte
          ctaLabel:
            type: text
            options:
              empty_type: string
            label: Libellé du bouton (optionnel)
          ctaHref:
            type: text
            options:
              empty_type: string
            label: Lien du bouton (optionnel)
            comment: "URL finale, préfixe de langue inclus (ex. /fr/contact)."

  # Jalons de la « Ligne du temps » ({year, title, text, accent}) — section
  # timeline (Notre histoire de Découvrir). Re-pointée par timeline.bookshop.yml.
  timeline_items:
    values:
      - label: Jalon
        icon: flag
        preview:
          icon: flag
          text:
            - key: year
            - text: Jalon
          subtext:
            - key: title
        value:
          year: ''
          title: ''
          text: ''
          accent: false
        _inputs:
          year:
            type: text
            options:
              empty_type: string
            label: Année
            comment: "Ex. « 2003 » — affichée en gros dans la case."
          title:
            type: text
            options:
              empty_type: string
            label: Titre du jalon
          text:
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Détail (optionnel)
          accent:
            type: switch
            label: Mettre en évidence
            comment: "Case accentuée (fond Bleu nuit + gros point) pour les jalons marquants."

  # Colonnes de technologies ({title, items[], subgroup?{label, items[]}}) pour
  # la section « tech-columns » (P-07). Re-pointée par tech-columns.bookshop.yml.
  # Les listes de chaînes déclarent leur type d'entrée par `items[*]` (leçon
  # P-05 : un tableau vide sans type d'entrée est « misconfigured »).
  tech_groups:
    values:
      - label: Colonne de technologies
        icon: dns
        preview:
          icon: dns
          text:
            - key: title
            - text: Colonne
        value:
          title: ''
          href: ''
          items: []
          subgroup:
            label: ''
            items: []
        _inputs:
          title:
            type: text
            options:
              empty_type: string
            label: Titre de la colonne
          href:
            type: text
            options:
              empty_type: string
            label: Lien du titre (facultatif)
            comment: "Adresse complète de la page, ex. /fr/services/approvisionnement-ti/cisco/ — vide = titre sans lien."
          items:
            type: array
            label: Éléments
            comment: "Une technologie / un outil par ligne."
          items[*]:
            type: text
            options:
              empty_type: string
            label: Élément
          subgroup:
            type: object
            label: Sous-groupe étiqueté (optionnel)
            comment: >-
              Ex. « Sources ouvertes et locales : » suivi de sa sous-liste.
              Laisser l'étiquette et la liste vides pour ne pas l'afficher.
          label:
            type: text
            options:
              empty_type: string
            label: Étiquette du sous-groupe

  # ---- Structures des collections « Page Contact » / « Page Carrières »
  # (2026-08-12). Chaque structure porte ses _inputs SCOPÉS — ils priment sur
  # la carte plate de la collection (même mécanique que footer_columns), ce qui
  # permet notamment deux sélecteurs d'icônes différents dans Carrières. ----

  # Carte bureau de la page Contact {city, lines[], image}. L'ordre du tableau
  # apparie les téléphones (gabarit) : Québec, Montréal, Paris.
  contact_office_items:
    values:
      - label: Carte bureau
        icon: location_city
        preview:
          icon: location_city
          text:
            - key: city
            - text: Bureau
        value:
          city: ''
          lines: []
          image: ''
        _inputs:
          city:
            type: text
            options:
              empty_type: string
            label: Ville
          lines:
            type: array
            label: Lignes d'adresse
          lines[*]:
            type: text
            options:
              empty_type: string
            label: Ligne
          image:
            type: image
            label: Photo du bureau
            comment: Partagée entre les deux langues — téléverser une seule fois.
            options:
              empty_type: string
              paths:
                static: public
                uploads: public/images/contact

  # Tuile de valeur {icon, label} de la section « Tuiles de valeurs »
  # (value-tiles — ex-page Carrières convertie en sections le 2026-09-17).
  # Icônes en CLÉS FERMÉES dessinées en SVG par le composant (carte ICONS de
  # value-tiles.astro) — en ajouter une = la dessiner là d'abord ; la liste
  # Sélecteur d'icône = banque unique _select_data.icones (2026-09-18).
  # Re-pointée par value-tiles.bookshop.yml.
  value_tile_items:
    values:
      - label: Valeur
        icon: stars
        preview:
          icon: stars
          text:
            - key: label
            - text: Valeur
        value:
          icon: etoile
          label: ''
        _inputs:
          icon:
            type: select
            label: Icône
            comment: Toute la banque de pictogrammes du site (les tracés sont dessinés par le site).
            options:
              empty_type: string
              allow_empty: false
              values: _select_data.icones
              value_key: cle
              preview:
                text:
                  - key: libelle
                image:
                  - key: apercu
          label:
            type: text
            options:
              empty_type: string
            label: Libellé de la valeur

  # Atout {icon, title, text} de la section « Photo + atouts » (photo-features).
  # Mêmes règles de clés fermées (carte ICONS de photo-features.astro ; liste
  # banque unique _select_data.icones depuis le 2026-09-18).
  # Re-pointée par photo-features.bookshop.yml.
  photo_feature_items:
    values:
      - label: Atout
        icon: task_alt
        preview:
          icon: task_alt
          text:
            - key: title
            - text: Atout
        value:
          icon: croissance
          title: ''
          text: ''
        _inputs:
          icon:
            type: select
            label: Icône
            comment: Toute la banque de pictogrammes du site (les tracés sont dessinés par le site).
            options:
              empty_type: string
              allow_empty: false
              values: _select_data.icones
              value_key: cle
              preview:
                text:
                  - key: libelle
                image:
                  - key: apercu
          title:
            type: text
            options:
              empty_type: string
            label: Titre de l'atout
          text:
            # Texte enrichi : gras · italique · lien, un paragraphe.
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Texte de l'atout

  # Carte témoignage {image, quote, name, role} de la section « Cartes
  # témoignages » (testimonial-cards). Re-pointée par
  # testimonial-cards.bookshop.yml.
  testimonial_card_items:
    values:
      - label: Témoignage
        icon: format_quote
        preview:
          icon: format_quote
          text:
            - key: name
            - text: Témoignage
          subtext:
            - key: role
        value:
          image: ''
          quote: ''
          name: ''
          role: ''
        _inputs:
          image:
            type: image
            label: Portrait
            comment: Partagé entre les deux langues — téléverser une seule fois.
            options:
              empty_type: string
              paths:
                static: public
                uploads: public/images/carrieres
          quote:
            # Texte enrichi : gras · italique · lien, un paragraphe. Garder les
            # guillemets dans le texte (« … »).
            type: html
            options:
              format: p
              bulletedlist: false
              numberedlist: false
              blockquote: false
              bold: true
              italic: true
              link: true
              undo: true
              redo: true
              underline: false
              strike: false
              image: false
              table: false
              code: false
              embed: false
              horizontalrule: false
              snippet: false
              remove_custom_markup: true
              empty_type: string
            label: Citation
          name:
            type: text
            options:
              empty_type: string
            label: Prénom
          role:
            type: text
            options:
              empty_type: string
            label: Rôle / poste
