    - cle: pierre
      libelle: Pierre (grège soutenu)
      couleur: '#dcd5cc'
      apercu: /images/cms/fonds/pierre.svg
    # Deux aplats bleus depuis le 2026-09-21 : le bleu de marque est passé au
