<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.site-header {
    background-color: #ffffff;
    box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.25);
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 100;
  }

  .header-container {
    max-width: 1280px;
    width: 100%;
    height: 72px;
    padding: 0 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Logo Styles */
  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .logo img {
    height: 40px;
    width: auto;
    display: block;
  }

  /* Navigation Styles */
  .main-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
  }

  .nav-item {
    color: #545f71;
    text-decoration: none;
    padding: 0 16px;
    display: flex;
    align-items: center;
    height: 100%;
    font-size: 16px;
    font-weight: 400;
    transition: color 0.2s ease, background-color 0.2s ease;
  }

  .nav-item:hover {
    color: #1a5bff;
    background-color: rgba(26, 91, 255, 0.05);
  }

  /* Trailing Actions Styles */
  .trailing-actions {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .action-link {
    color: #545f71;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: color 0.2s ease;
  }

  .action-link:hover {
    color: #1a5bff;
  }

  .icon-button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background-color 0.2s ease;
  }

  .icon-button:hover {
    background-color: rgba(84, 95, 113, 0.1);
  }

  .icon-button img {
    width: 18px;
    height: 18px;
    display: block;
  }

  .button-primary {
    background-color: #1a5bff;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .button-primary:hover {
    background-color: #0043e0;
  }
  
  .button-primary:active {
    transform: translateY(1px);
    box-shadow: 0px 0px 1px 0px rgba(0, 0, 0, 0.25);
  }

  /* Responsive Design */
  @media (max-width: 1100px) {
    .header-container {
      padding: 0 24px;
    }
    .main-nav {
      gap: 0;
    }
    .nav-item {
      padding: 0 12px;
      font-size: 15px;
    }
    .trailing-actions {
      gap: 16px;
    }
  }

  @media (max-width: 900px) {
    .main-nav {
      display: none; /* Hide main nav on tablet/mobile, would typically be replaced by a hamburger menu */
    }
    .header-container {
      justify-content: space-between;
    }
  }

  @media (max-width: 600px) {
    .header-container {
      padding: 0 16px;
    }
    .lang-switch, .portal-link {
      display: none; /* Simplify header on small mobile screens */
    }
    .trailing-actions {
      gap: 12px;
    }
    .button-primary {
      padding: 10px 16px;
    }
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="site-header">
    <div class="header-container">
      <!-- Logo -->
      <a href="#" class="logo" aria-label="Victrix Home">
        <img src="images/56336fb3c3d524df4c3912672e201908518b56ef.png" alt="Victrix Logo">
      </a>
      
      <!-- Main Navigation -->
      <nav class="main-nav" aria-label="Main Navigation">
        <a href="#" class="nav-item">Découvrir Victrix</a>
        <a href="#" class="nav-item">Expertises</a>
        <a href="#" class="nav-item">Services</a>
        <a href="#" class="nav-item">Ressources</a>
        <a href="#" class="nav-item">Produits</a>
      </nav>
      
      <!-- Trailing Actions -->
      <div class="trailing-actions">
        <a href="#" class="action-link lang-switch">EN</a>
        <button class="icon-button search-btn" aria-label="Search">
          <img src="images/85_94.svg" alt="Search Icon">
        </button>
        <a href="#" class="action-link portal-link">Portail Client</a>
        <a href="#" class="button-primary">Contact</a>
      </div>
    </div>
  </header>
</section>
</body>
</html>
