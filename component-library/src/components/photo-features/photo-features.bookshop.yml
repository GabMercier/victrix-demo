# =============================================================================
# Spec Bookshop — section « Photo + atouts » (palette partagée, 2026-09-17 —
# conversion de la page Carrières en page « sections »).
# Voir hero.bookshop.yml pour les conventions communes. Les atouts vivent dans
# la structure `_structures.photo_feature_items` (cloudcannon.config.yml) —
# icône choisie dans la banque unique (`_select_data.icones`, vignettes).
# =============================================================================
spec:
  structures:
    - sections
  label: "Photo + atouts"
  description: "Photo avec carte flottante bleue à gauche ; titre, chapeau et grille 2×2 d'atouts (icône, titre, texte) à droite — « Pourquoi rejoindre notre équipe »."
  icon: groups
  picker_preview:
    image: "/_cloudcannon/bookshop_thumbs/photo-features/preview.png"
    text: Photo + atouts
    subtext: Photo + carte flottante, titre, chapeau, grille 2×2 d'atouts
  preview:
    icon: groups
    text:
      - key: title
      - text: Photo + atouts

blueprint:
  type: photo-features
  title: "Pourquoi rejoindre notre équipe?"
  lead: "Victrix valorise ses employés et offre un environnement de travail enrichissant."
  cardTitle: "Un environnement stimulant"
  cardText: "Contribuez à notre succès et épanouissez-vous au sein d'une équipe passionnée."
  image: "/images/carrieres/equipe-environnement.jpg"
  imageAlt: ""
  fond: blanc
  items:
    - icon: croissance-pleine
      title: "Développement personnel"
      text: "Accompagnement continu dans vos aspirations professionnelles."
    - icon: progression
      title: "Évolution de carrière"
      text: "Opportunités réelles de progression au sein du groupe."

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat de sections — ne pas modifier."
  title:
    label: "Titre"
  lead:
    type: html
    label: "Chapeau (optionnel)"
    comment: "Paragraphe d'introduction sous le titre — gras, italique, lien."
    options:
      format: p
      bulletedlist: false
      numberedlist: false
      blockquote: false
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  cardTitle:
    label: "Carte flottante — titre (optionnel)"
    comment: "Titre de la carte bleue posée sur la photo. Vide = pas de carte."
  cardText:
    type: html
    label: "Carte flottante — texte"
    options:
      format: p
      bulletedlist: false
      numberedlist: false
      blockquote: false
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  image:
    type: image
    label: "Photo"
    comment: >-
      Photo de gauche (recadrée en 500 px de haut). Le fichier téléversé
      atterrit dans public/images/carrieres/ (adresse servie telle quelle,
      /images/…).
    options:
      empty_type: string
      paths:
        static: public
        uploads: public/images/carrieres
  imageAlt:
    label: "Texte alternatif de la photo"
    comment: "Description pour l'accessibilité (laisser vide si la photo est purement décorative)."
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      # Palette partagée : liste d'objets {cle, libelle, couleur, apercu}
      # définie UNE fois dans cloudcannon.config.yml (_select_data.fonds).
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  items:
    # `type: array` explicite + structure déclarée à la main dans
    # cloudcannon.config.yml (_structures.photo_feature_items).
    type: array
    label: "Atouts"
    comment: "Grille 2×2 : icône, titre, texte. Quatre atouts remplissent la grille."
    options:
      structures: _structures.photo_feature_items
