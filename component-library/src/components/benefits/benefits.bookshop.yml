# =============================================================================
# Spec Bookshop — section « Cartes à icônes » (contrat landing GELÉ — la clé
# technique reste `benefits` : RENOMMAGE D'AFFICHAGE SEULEMENT, 2026-08-17,
# demande user — le bloc sert bien au-delà des « bénéfices » : approche,
# valeurs, avantages…).
# Voir hero.bookshop.yml pour les conventions communes (structures `sections`,
# discriminant `type` masqué, libellés français pour la palette CloudCannon).
# NOTE : la clé `title` de _inputs s'applique par cascade au titre de la
# section ET au titre de chaque carte (même nom de champ) — libellé partagé
# « Titre », voulu.
# =============================================================================
spec:
  structures:
    - sections
  label: "Cartes à icônes"
  description: "Grille de cartes (icône, titre, description) — bénéfices, approche, valeurs… 1 à 3 colonnes selon la largeur d'écran."
  icon: fact_check
  # Polissage du sélecteur CloudCannon — voir hero.bookshop.yml (les clés de
  # `spec` sont recopiées sur la valeur de structure générée).
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/benefits/benefits.preview.png"
    text: Cartes à icônes
    subtext: Grille de cartes (icône, titre, description)
  preview:
    icon: fact_check
    text:
      - key: title
      - text: Cartes à icônes

blueprint:
  type: benefits
  title: "Pourquoi choisir Victrix"
  intro: ""
  fond: ivoire
  headingStyle: titre
  numerotation: true
  items:
    - title: "Première carte"
      description: "Décrivez le point clé de cette carte."
      icon: ""

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat landing — ne pas modifier."
  title:
    label: "Titre"
  intro:
    type: html
    label: "Introduction"
    comment: "Paragraphe optionnel sous le titre de section."
  # « Fond de section » (2026-08-17, pilote 6 blocs) : choix BORNÉ à la
  # palette officielle — 5 fonds clairs, jamais de couleur libre (esprit P-16).
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      # Palette partagée (2026-09-17) : liste d'objets {cle, libelle, couleur, apercu}
      # définie UNE fois dans cloudcannon.config.yml (_select_data.fonds) — la valeur
      # enregistrée reste la clé texte ; l'éditeur affiche libellé + pastille.
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  headingStyle:
    type: select
    label: "Style de tête"
    options:
      allow_empty: false
      values:
        - titre
        - compact
    comment: "« titre » = grand titre 40 px ; « compact » = tête réduite + liseré bleu et cartes compactes (patron landing)."
  numerotation:
    type: switch
    label: "Afficher la numérotation"
    comment: "Compteur 01, 02, 03… en haut à droite de chaque carte (maquette Approche). À décocher quand la grille est un inventaire et non une démarche ordonnée. Sans effet sur le style de tête « compact »."
  items:
    # `type: array` explicite : sans lui, `npx @bookshop/generate` fabriquerait
    # une structure inline générique à partir du blueprint (et viderait la
    # carte d'exemple), en concurrence avec la palette _structures.benefit_items
    # de cloudcannon.config.yml — bail-out vérifié dans structure-builder.js.
    type: array
    label: "Cartes"
    comment: "Cartes affichées en grille."
    options:
      structures: _structures.benefit_items
  description:
    type: html
    label: "Description"
    options:
      format: p
      bulletedlist: false
      numberedlist: false
      blockquote: false
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  icon:
    type: select
    label: "Icône (optionnelle)"
    options:
      allow_empty: true
      values: _select_data.icones
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
    comment: "Tuile pictogramme au-dessus du titre de la carte. Vide = aucune. organisation/porteur/destinataire = icônes pleines de la page Expertises."
