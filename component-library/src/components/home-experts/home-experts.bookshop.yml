# =============================================================================
# Spec Bookshop — section « Bandeau experts » (accueil composable).
# Voir home-hero.bookshop.yml pour les conventions communes.
# =============================================================================
spec:
  structures:
    - sections
  label: "Accueil — Bandeau experts"
  description: "Bandeau marine d'appel à l'action : titre, sous-titre et bouton vert accent, alignés en ligne."
  icon: groups
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/home-experts/home-experts.preview.png"
    text: "Accueil — Bandeau experts"
    subtext: Bandeau marine, titre + bouton d'appel à l'action
  preview:
    icon: groups
    text:
      - key: title
      - text: Bandeau experts

blueprint:
  type: home-experts
  fond: sable
  title: "Rencontrez nos experts"
  subtitle: ""
  ctaLabel: "Nous joindre"
  ctaHref: "/fr/contact"

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat sections — ne pas modifier."
  # « Fond de section » (2026-09-21) : choix BORNÉ à la palette officielle,
  # jamais de couleur libre — même champ que les autres sections.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      values: _select_data.fonds_etendus
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  title:
    label: "Titre"
  subtitle:
    type: html
    label: "Sous-titre"
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  ctaLabel:
    label: "Libellé du bouton"
  ctaHref:
    label: "Lien du bouton"
    comment: "URL finale, préfixe de langue inclus (ex. /fr/contact)."
