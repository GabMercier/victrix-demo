# =============================================================================
# Spec Bookshop — section « Bandeau ISO 27001 » (accueil composable).
# Voir home-hero.bookshop.yml pour les conventions communes (palette `sections`
# partagée, discriminant `type` masqué, libellés français).
# =============================================================================
spec:
  structures:
    - sections
  label: "Accueil — Barre de confiance"
  description: "Bande claire de chiffres clés et certifications (ex. 30+ ans, 250+ experts, ISO 27001). Sans éléments, retombe sur l'ancien bandeau titre + sous-titre."
  icon: verified
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/home-iso/home-iso.preview.png"
    text: "Accueil — Barre de confiance"
    subtext: Chiffres clés et certifications en bande claire
  preview:
    icon: verified
    text:
      - key: title
      - text: "Barre de confiance"

blueprint:
  type: home-iso
  fond: blanc
  title: "Ils nous font confiance"
  subtitle: "La sécurité de l’information au cœur de toutes nos pratiques."
  items:
    - value: "30+ ans"
      label: "d’expertise"

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat sections — ne pas modifier."
  # « Fond de section » (2026-09-21) : choix BORNÉ à la palette officielle,
  # jamais de couleur libre — même champ que les autres sections.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  title:
    label: "Titre (masqué quand des éléments existent)"
  subtitle:
    type: html
    label: "Sous-titre (rendu seulement sans éléments)"
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  items:
    label: "Éléments de confiance"
    comment: "Chiffre ou mention (valeur) + libellé court. Tableau vide = ancien bandeau."
  value:
    label: "Valeur"
  label:
    label: "Libellé"
