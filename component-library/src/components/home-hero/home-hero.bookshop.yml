# =============================================================================
# Spec Bookshop — section « Bannière d'accueil » (accueil composable).
# Voir hero.bookshop.yml (campagnes) pour les conventions communes. Le tag
# `structures: [sections]` place cette section dans la MÊME palette globale que
# les sections de campagne : les sections d'accueil deviennent disponibles pour
# les landings, et inversement (choix assumé — une seule palette).
# =============================================================================
spec:
  structures:
    - sections
  label: "Accueil — Bannière"
  description: "Bannière d'entête de l'accueil : surtitre, titre, sous-titre et bouton. À placer en première position (elle porte le <h1> de la page)."
  icon: title
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/home-hero/preview.png"
    text: "Accueil — Bannière"
    subtext: Titre principal, sous-titre et bouton — toujours en premier
  preview:
    icon: title
    text:
      - key: title
      - text: "Accueil — Bannière"

blueprint:
  type: home-hero
  h1Element: titre
  eyebrow: "Services-conseils en TI"
  title: "Titre de la bannière"
  titleAccent: ""
  subtitle: ""
  ctaLabel: "Découvrir Victrix"
  ctaHref: "/fr/decouvrir"
  image: ""
  cta2Label: ""
  cta2Href: ""

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat sections — ne pas modifier."
  eyebrow:
    label: "Surtitre"
    comment: "Courte ligne affichée au-dessus du titre (optionnel)."
  title:
    label: "Titre"
  titleAccent:
    label: "Mot accentué du titre"
    comment: "Sous-chaîne du titre affichée en bleu (ex. « vraiment »). Vide = titre uniforme."
  subtitle:
    type: html
    label: "Sous-titre"
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  ctaLabel:
    label: "Libellé du bouton"
  ctaHref:
    label: "Lien du bouton"
    comment: "URL finale, préfixe de langue inclus (ex. /fr/decouvrir)."
  image:
    label: "Photo de fond"
    comment: "Chemin public (ex. /images/home/hero-accueil.jpg) — voilée d'ivoire pour la lisibilité. Vide = fond uni."
  cta2Label:
    label: "Libellé du second bouton"
    comment: "Bouton contour à droite du principal (optionnel — vide = absent)."
  cta2Href:
    label: "Lien du second bouton"
    comment: "URL finale, préfixe de langue inclus."

  # Contrôle du H1 (Phase 2, 2026-09-16 — demande SEO de Julie, recette 09/09 pt 6).
  h1Element:
    type: select
    label: "Élément qui porte le H1 (SEO)"
    options:
      allow_empty: false
      values:
        - titre
        - surtitre
    comment: "« titre » = le grand titre est le H1 de la page (défaut). « surtitre » = le surtitre devient le H1 (mot-clé court pour les moteurs) et le grand titre passe en H2 — l'apparence ne change pas. Sans surtitre, le titre reste le H1."
