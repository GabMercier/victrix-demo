# =============================================================================
# Spec Bookshop — section « Appel à l'action » (contrat landing GELÉ).
# Voir hero.bookshop.yml pour les conventions communes (structures `sections`,
# discriminant `type` masqué, libellés français pour la palette CloudCannon).
# =============================================================================
spec:
  structures:
    - sections
  label: "Appel à l'action"
  description: "Bandeau incitatif : titre, texte optionnel et bouton. Variante pâle (défaut), marine, nuit ou primaire (aplat bleu pleine largeur, bouton blanc en majuscules)."
  icon: campaign
  # Polissage du sélecteur CloudCannon — voir hero.bookshop.yml (les clés de
  # `spec` sont recopiées sur la valeur de structure générée).
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/cta/cta.preview.png"
    text: Appel à l'action
    subtext: Bande de conversion avec bouton (variante pâle ou foncée)
  preview:
    icon: campaign
    text:
      - key: title
      - text: Appel à l'action

blueprint:
  type: cta
  title: "Prêt à passer à l'action ?"
  body: ""
  ctaLabel: "Nous joindre"
  ctaHref: "/fr/nous-joindre/"
  cta2Label: ""
  cta2Href: ""
  variant: light
  fond: blanc

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat landing — ne pas modifier."
  title:
    label: "Titre"
  body:
    type: html
    label: "Texte"
    comment: "Paragraphe d'appui sous le titre (optionnel)."
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  ctaLabel:
    label: "Libellé du bouton"
  ctaHref:
    label: "Lien du bouton"
    comment: "URL de destination, p. ex. /fr/nous-joindre/."
  cta2Label:
    label: "Libellé du second bouton (optionnel)"
    comment: "Bouton contour à droite du principal. Vide = absent."
  cta2Href:
    label: "Lien du second bouton"
    comment: "URL de destination, préfixe de langue inclus."
  variant:
    type: select
    label: "Variante"
    comment: "« light » : bandeau pâle (défaut) ; « dark » : bandeau bleu ; « nuit » : panneau anthracite centré (page produit) ; « primaire » : aplat bleu PLEINE LARGEUR centré, bouton blanc en majuscules (page Carrières) — le Fond de section est alors sans effet."
    options:
      values:
        - light
        - dark
        - nuit
        - primaire
  # « Fond de section » (2026-08-17, pilote 6 blocs) : lavis DERRIÈRE le
  # panneau (le panneau garde sa « Variante ») — borné à la palette officielle.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      # Palette partagée (2026-09-17) : liste d'objets {cle, libelle, couleur, apercu}
      # définie UNE fois dans cloudcannon.config.yml (_select_data.fonds) — la valeur
      # enregistrée reste la clé texte ; l'éditeur affiche libellé + pastille.
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
