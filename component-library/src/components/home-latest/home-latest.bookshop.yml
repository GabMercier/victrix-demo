# =============================================================================
# Spec Bookshop — section « Derniers articles » (accueil composable).
# Voir home-hero.bookshop.yml pour les conventions communes.
#
# SECTION DYNAMIQUE : seuls le titre et le lien sont éditables. Les cartes sont
# alimentées par la collection blog AU BUILD (voir home-latest.astro) ; dans
# l'éditeur visuel, des cartes factices tiennent lieu d'aperçu.
# =============================================================================
spec:
  structures:
    - sections
  label: "Accueil — Derniers articles"
  description: "Bloc « derniers articles » : titre, lien vers le blogue, et grille des 3 articles les plus récents (alimentée automatiquement au build)."
  icon: article
  picker_preview:
    text: "Accueil — Derniers articles"
    subtext: Titre + lien + 3 articles récents (automatique)
  preview:
    icon: article
    text:
      - key: title
      - text: Derniers articles

blueprint:
  type: home-latest
  title: "Nos derniers articles"
  ctaLabel: "Voir toutes les ressources"
  ctaHref: "/fr/ressources"

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat sections — ne pas modifier."
  title:
    label: "Titre"
  ctaLabel:
    label: "Libellé du lien"
  ctaHref:
    label: "Lien"
    comment: "URL finale, préfixe de langue inclus (ex. /fr/ressources)."
