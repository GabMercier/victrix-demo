# =============================================================================
# Spec Bookshop — section « Bento des domaines d'expertise » (palette
# partagée), NOUVELLE 2026-08-05 (fidélité maquette expertise-mere.css). Voir
# hero.bookshop.yml pour les conventions communes. La grille `items` pointe
# vers _structures.bento_items (cloudcannon.config.yml) — `type: array`
# explicite, même garde-fou que benefits.
# =============================================================================
spec:
  structures:
    - sections
  label: "Service — Bento d'expertises"
  description: "Grille bento 4 colonnes de cartes à peau (blanche, bleue, ardoise) et taille (grande, haute, large, petite) : domaines d'expertise d'une page mère."
  icon: dashboard
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/expertise-bento/expertise-bento.preview.png"
    text: "Service — Bento d'expertises"
    subtext: Grille bento de cartes (peaux et tailles variées)
  preview:
    icon: dashboard
    text:
      - key: title
      - text: Bento d'expertises

blueprint:
  type: expertise-bento
  fond: ivoire
  eyebrow: ""
  title: "Titre de la section"
  intro: ""
  items:
    - title: "Domaine d'expertise"
      text: ""
      peau: blanche
      taille: petite
      icon: ""
      image: ""
      href: ""

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat de sections — ne pas modifier."
  # « Fond de section » (2026-09-21) : choix BORNÉ à la palette officielle,
  # jamais de couleur libre — même champ que les autres sections.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  eyebrow:
    label: "Surtitre (optionnel)"
  title:
    label: "Titre"
  intro:
    type: html
    label: "Paragraphe d'appui"
    comment: "Aligné à droite du titre (optionnel)."
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  items:
    type: array
    label: "Cartes du bento"
    comment: "Placées dans une grille 4 colonnes selon leur taille, dans l'ordre."
    options:
      structures: _structures.bento_items

  text:
    type: html
    label: "Texte"
    comment: "Texte enrichi EN LIGNE (gras, italique, lien) — rendu dans un paragraphe existant."
    options:
      format: p
      bulletedlist: false
      numberedlist: false
      blockquote: false
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string