# =============================================================================
# Spec Bookshop — section « FAQ » (contrat landing GELÉ).
# Voir hero.bookshop.yml pour les conventions communes (structures `sections`,
# discriminant `type` masqué, libellés français pour la palette CloudCannon).
# NOTE : en plus de l'accordéon visible, la section émet un balisage JSON-LD
# FAQPage (schema.org) construit depuis les questions — via le composant gelé
# src/components/JsonLd.astro.
# =============================================================================
spec:
  structures:
    - sections
  label: "FAQ"
  description: "Accordéon de questions-réponses (panneaux dépliables accessibles au clavier) avec balisage FAQPage (JSON-LD) pour les résultats enrichis des moteurs de recherche."
  icon: quiz
  # Polissage du sélecteur CloudCannon — voir hero.bookshop.yml (les clés de
  # `spec` sont recopiées sur la valeur de structure générée).
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/faq/faq.preview.png"
    text: FAQ
    subtext: Accordéon de questions-réponses (balisage FAQPage inclus)
  preview:
    icon: quiz
    text:
      - key: title
      - text: FAQ

blueprint:
  type: faq
  title: "Foire aux questions"
  fond: ivoire
  items:
    - question: "Quelle est votre question la plus fréquente ?"
      answer: "Rédigez ici une réponse claire et concise, en une ou deux phrases."

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat landing — ne pas modifier."
  title:
    label: "Titre"
  # « Fond de section » (2026-08-17, pilote 6 blocs) : choix BORNÉ à la
  # palette officielle — 5 fonds clairs, jamais de couleur libre (esprit P-16).
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      # Palette partagée (2026-09-17) : liste d'objets {cle, libelle, couleur, apercu}
      # définie UNE fois dans cloudcannon.config.yml (_select_data.fonds) — la valeur
      # enregistrée reste la clé texte ; l'éditeur affiche libellé + pastille.
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  items:
    # `type: array` explicite : sans lui, `npx @bookshop/generate` fabriquerait
    # une structure inline générique à partir du blueprint (et viderait la
    # question d'exemple) — même bail-out que benefits.bookshop.yml.
    # La palette _structures.faq_items est déclarée à la main dans
    # cloudcannon.config.yml, comme _structures.benefit_items.
    type: array
    label: "Questions"
    comment: "Chaque élément devient un panneau dépliable ET une entrée du balisage FAQPage."
    options:
      structures: _structures.faq_items
  question:
    label: "Question"
  answer:
    type: html
    label: "Réponse"
    comment: "Texte brut, sans HTML — repris tel quel dans le JSON-LD FAQPage."

    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string