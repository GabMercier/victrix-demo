# =============================================================================
# Spec Bookshop — section « Partenaires » (accueil composable).
# Voir home-hero.bookshop.yml pour les conventions communes. `names` est un
# simple tableau de chaînes (noms de partenaires).
# =============================================================================
spec:
  structures:
    - sections
  label: "Accueil — Partenaires"
  description: "Bande de noms de partenaires ou de technologies, alignés et centrés, sous un court titre."
  icon: handshake
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/home-partners/home-partners.preview.png"
    text: "Accueil — Partenaires"
    subtext: Titre + liste de noms alignés
  preview:
    icon: handshake
    text:
      - key: title
      - text: Partenaires

blueprint:
  type: home-partners
  fond: ivoire
  title: "Nos partenaires"
  names:
    - "Partenaire 1"

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat sections — ne pas modifier."
  # « Fond de section » (2026-09-21) : choix BORNÉ à la palette officielle,
  # jamais de couleur libre — même champ que les autres sections.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  title:
    label: "Titre"
  names:
    type: array
    label: "Noms des partenaires"
    comment: "Un nom par ligne."
