# =============================================================================
# Spec Bookshop — section « Boîtes de domaines » (palette partagée, P-07).
# Voir hero.bookshop.yml pour les conventions communes.
#
# `boxes` = tableau de CHAÎNES : le type d'entrée est déclaré par la notation
# `boxes[*]` (leçon P-05 : un tableau vide sans type d'entrée est « misconfigured »).
# =============================================================================
spec:
  structures:
    - sections
  label: "Boîtes de domaines"
  description: "Titre à liseré vert, sous-titre et grille de boîtes bordées portant des libellés courts (domaines d'expertise, champs d'intervention…)."
  icon: grid_view
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/feature-boxes/feature-boxes.preview.png"
    text: "Boîtes de domaines"
    subtext: Grille de libellés courts encadrés
  preview:
    icon: grid_view
    text:
      - key: sectionTitle
      - text: Boîtes de domaines

blueprint:
  type: feature-boxes
  sectionTitle: "Titre de la section"
  subtitle: ""
  fond: givre
  boxes:
    - "Premier domaine"

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat de sections — ne pas modifier."
  sectionTitle:
    label: "Titre de la section"
  subtitle:
    type: html
    label: "Sous-titre (optionnel)"
  # « Fond de section » (2026-08-17, pilote 6 blocs) : choix BORNÉ à la
  # palette officielle — 5 fonds clairs, jamais de couleur libre (esprit P-16).
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      # Palette partagée (2026-09-17) : liste d'objets {cle, libelle, couleur, apercu}
      # définie UNE fois dans cloudcannon.config.yml (_select_data.fonds) — la valeur
      # enregistrée reste la clé texte ; l'éditeur affiche libellé + pastille.
      values: _select_data.fonds
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste)."
  boxes:
    type: array
    label: "Boîtes"
    comment: "Un libellé court par boîte."
  boxes[*]:
    type: text
    label: "Libellé"
