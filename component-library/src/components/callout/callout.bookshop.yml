# =============================================================================
# Spec Bookshop — section « Encadré d'appel à l'action » (palette partagée, P-07).
# Voir hero.bookshop.yml pour les conventions communes.
# =============================================================================
spec:
  structures:
    - sections
  label: "Encadré / bandeau d'action"
  description: "Appel à l'action réutilisable : « box » = encadré centré sur fond pâle ; « banner-green » = bandeau vert large (titre et texte à gauche, bouton à droite)."
  icon: ads_click
  picker_preview:
    # Vignette du sélecteur « Add Section » (2026-08-17) : CloudCannon ne
    # lit plus le preview_image légal posé par @bookshop/generate — on
    # pointe EXPLICITEMENT la clé image sur l'URL déterministe où generate
    # reloge le preview.png du composant au postbuild.
    image: "/_cloudcannon/bookshop_thumbs/callout/callout.preview.png"
    text: "Encadré / bandeau d'action"
    subtext: Encadré centré ou bandeau vert
  preview:
    icon: ads_click
    text:
      - key: title
      - text: Encadré d'action

blueprint:
  type: callout
  fond: ivoire
  title: "Titre de l'appel à l'action"
  body: ""
  ctaLabel: ""
  ctaHref: ""
  layout: box

preview:

_inputs:
  type:
    hidden: true
    comment: "Discriminant technique du contrat de sections — ne pas modifier."
  # « Fond de section » (2026-09-21) : choix BORNÉ à la palette officielle,
  # jamais de couleur libre — même champ que les autres sections.
  fond:
    type: select
    label: "Fond de section"
    options:
      allow_empty: false
      values: _select_data.fonds_etendus
      value_key: cle
      preview:
        text:
          - key: libelle
        image:
          - key: apercu
        icon: square
        icon_color:
          - key: couleur
    comment: "Couleur de fond de la section, bornée à la palette officielle (pastilles dans la liste). « Bleu électrique » est un fond sombre : cette section passe alors ses textes en blanc."
  title:
    label: "Titre"
  body:
    type: html
    label: "Texte (optionnel)"
    options:
      format: p h3 h4
      styles: /styles/editor-styles.css
      bulletedlist: true
      numberedlist: true
      blockquote: true
      bold: true
      italic: true
      link: true
      undo: true
      redo: true
      underline: false
      strike: false
      image: false
      table: false
      code: false
      embed: false
      horizontalrule: false
      snippet: false
      remove_custom_markup: true
      empty_type: string
  ctaLabel:
    label: "Libellé du bouton (optionnel)"
  ctaHref:
    label: "Lien du bouton (optionnel)"
    comment: "URL finale, préfixe de langue inclus (ex. /fr/contact)."
  layout:
    type: select
    label: "Présentation"
    comment: "« box » = encadré centré sur fond pâle ; « banner-green » = bandeau vert pleine largeur."
    options:
      values:
        - box
        - banner-green
